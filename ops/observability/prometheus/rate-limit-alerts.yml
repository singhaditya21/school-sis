groups:
  - name: school-sis-rate-limiting
    interval: 30s
    rules:
      - alert: SchoolSisRateLimitBackendDegraded
        expr: min by (backend) (school_sis_rate_limit_backend_healthy) == 0
        for: 2m
        labels:
          severity: critical
          service: school-sis-web
        annotations:
          summary: School SIS rate-limit backend is degraded
          description: Strict public, login, and AI endpoints are using the bounded in-process fallback.
          runbook_url: docs/OBSERVABILITY_SRE_ARCHITECTURE.md#rate-limit-response

      - alert: SchoolSisRateLimitFallbackActive
        expr: sum(rate(school_sis_rate_limit_decisions_total{outcome=~"degraded_.*"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: school-sis-web
        annotations:
          summary: School SIS strict rate-limit fallback is active
          description: Requests have used a degraded in-process rate-limit path for at least five minutes.
          runbook_url: docs/OBSERVABILITY_SRE_ARCHITECTURE.md#rate-limit-response

      - alert: SchoolSisRateLimitFallbackCapacityExhausted
        expr: sum(increase(school_sis_rate_limit_fallback_capacity_exhaustions_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
          service: school-sis-web
        annotations:
          summary: School SIS rate-limit fallback reached its memory bound
          description: New strict identities are being denied to preserve fail-closed behavior and process memory.
          runbook_url: docs/OBSERVABILITY_SRE_ARCHITECTURE.md#rate-limit-response

      - alert: SchoolSisRateLimitBackendFailures
        expr: sum(increase(school_sis_rate_limit_backend_failures_total[10m])) >= 3
        for: 0m
        labels:
          severity: warning
          service: school-sis-web
        annotations:
          summary: Repeated School SIS rate-limit backend failures
          description: Three or more backend consume, delete, or health operations failed in ten minutes.
          runbook_url: docs/OBSERVABILITY_SRE_ARCHITECTURE.md#rate-limit-response
