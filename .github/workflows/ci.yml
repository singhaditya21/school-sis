name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.9"

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect Dependency Graph Availability
        id: dependency_graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" \
            >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Graph is unavailable; running the full dependency audit fallback."
          fi

      - name: Review dependency changes
        if: steps.dependency_graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Install pnpm for fallback audit
        if: steps.dependency_graph.outputs.available != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js for fallback audit
        if: steps.dependency_graph.outputs.available != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies for fallback audit
        if: steps.dependency_graph.outputs.available != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run full dependency audit fallback
        if: steps.dependency_graph.outputs.available != 'true'
        run: |
          pnpm audit --json > pnpm-audit-high.json || true
          pnpm audit:check -- pnpm-audit-high.json

  rls-integration:
    name: Tenant RLS Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_sis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_sis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_sis_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/school_sis_test
      DATABASE_SSL_MODE: disable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable pgvector Extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d school_sis_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Apply Schema and Tenant RLS
        run: |
          pnpm --filter @school-sis/web run db:migrate
          pnpm --filter @school-sis/web run db:rls

      - name: Verify Tenant Isolation
        run: pnpm --filter @school-sis/web run db:test:rls

  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Dependency Audit
        run: |
          pnpm audit --json > pnpm-audit-high.json || true
          pnpm audit:check -- pnpm-audit-high.json

      - name: Run Secret Pattern Scan
        run: pnpm audit:secrets

      - name: Enforce Static Risk-Debt Ratchet
        run: pnpm audit:debt

      - name: Validate Drizzle Migrations
        run: pnpm --filter @school-sis/web exec drizzle-kit check

      - name: Reject Unapproved Destructive Migrations
        run: pnpm audit:migrations

      - name: Validate RLS Policy Matrix
        run: pnpm audit:rls-matrix

      - name: Run TypeScript
        run: pnpm --filter @school-sis/web exec tsc --noEmit --pretty false --incremental false

      - name: Run Build
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Analyze Bundle Budget
        run: pnpm perf:bundle

      - name: Run Linting
        run: pnpm --filter @school-sis/web exec eslint src --quiet

      - name: Validate Testing Architecture
        run: pnpm test:architecture

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Validate Load Test Harness
        run: pnpm --filter @school-sis/web run perf:load -- --dry-run

      - name: Upload CI Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ github.run_id }}
          path: |
            pnpm-audit-high.json
          if-no-files-found: ignore
          retention-days: 14
