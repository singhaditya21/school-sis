name: Production Release

on:
  workflow_run:
    workflows: ["E2E Tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  tenant-context-key-contract:
    name: Pin distinct tenant-context key fingerprints
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      production_fingerprint: ${{ steps.pins.outputs.production_fingerprint }}
      production_key_id: ${{ steps.pins.outputs.production_key_id }}
      preview_fingerprint: ${{ steps.pins.outputs.preview_fingerprint }}
      preview_key_id: ${{ steps.pins.outputs.preview_key_id }}
    steps:
      - name: Read the reviewed key contract from the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      # This job deliberately has no GitHub Environment. Both protected jobs
      # consume the same reviewed file, so environment variable precedence
      # cannot present a different key/fingerprint pair to each deployment.
      - name: Validate tracked signing-key contract
        id: pins
        env:
          PINNED_PRODUCTION_FINGERPRINT: ${{ vars.PRODUCTION_TENANT_CONTEXT_SIGNING_SECRET_SHA256 }}
          PINNED_PREVIEW_FINGERPRINT: ${{ vars.PREVIEW_TENANT_CONTEXT_SIGNING_SECRET_SHA256 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const exactKeys = (value, keys, label) => {
            if (!value || typeof value !== 'object' || Array.isArray(value) ||
                JSON.stringify(Object.keys(value).sort()) !== JSON.stringify([...keys].sort())) {
              throw new Error(`${label} has unexpected or missing keys.`);
            }
          };
          const contract = JSON.parse(readFileSync('.github/tenant-context-key-contract.json', 'utf8'));
          exactKeys(contract, ['version', 'production', 'preview'], 'tenant-context key contract');
          if (contract.version !== 1) throw new Error('Unsupported tenant-context key contract version.');
          for (const environment of ['production', 'preview']) {
            const entry = contract[environment];
            exactKeys(entry, ['keyId', 'secretSha256'], `${environment} tenant-context key contract`);
            if (!/^[a-z0-9][a-z0-9._-]{0,31}$/.test(entry.keyId) ||
                !/^[0-9a-f]{64}$/.test(entry.secretSha256)) {
              throw new Error(`${environment} tenant-context key contract is malformed.`);
            }
          }
          if (contract.production.keyId === contract.preview.keyId ||
              contract.production.secretSha256 === contract.preview.secretSha256) {
            throw new Error('Production and preview tenant-context key contracts must be distinct.');
          }
          if (contract.production.secretSha256 !== process.env.PINNED_PRODUCTION_FINGERPRINT ||
              contract.preview.secretSha256 !== process.env.PINNED_PREVIEW_FINGERPRINT) {
            throw new Error('Tracked tenant-context fingerprints do not match the shared repository pins.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `production_fingerprint=${contract.production.secretSha256}\n` +
            `production_key_id=${contract.production.keyId}\n` +
            `preview_fingerprint=${contract.preview.secretSha256}\n` +
            `preview_key_id=${contract.preview.keyId}\n`);
          NODE

  deploy-production:
    name: Verify, migrate, stage, and promote production
    needs: tenant-context-key-contract
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      NODE_VERSION: "24"
      PNPM_VERSION: "9.15.9"
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      TENANT_CONTEXT_AUDIENCE: production:${{ vars.NEON_PROJECT_ID }}:${{ vars.NEON_PRODUCTION_BRANCH_ID }}

    steps:
      - name: Fail closed on missing production configuration
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY_VALUE: ${{ secrets.NEON_API_KEY }}
          NEON_DIRECT_URL_VALUE: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          METRICS_TOKEN_VALUE: ${{ secrets.METRICS_TOKEN }}
          VERCEL_BYPASS_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEON_PROJECT_ID_VALUE: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID_VALUE: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
          NEON_DATABASE_VALUE: ${{ vars.NEON_DATABASE_NAME }}
          NEON_ROLE_VALUE: ${{ vars.NEON_MIGRATION_ROLE }}
          NEON_RUNTIME_ROLE_VALUE: ${{ vars.NEON_RUNTIME_ROLE }}
          NEON_PLATFORM_ROLE_VALUE: ${{ vars.NEON_PLATFORM_ROLE }}
          TENANT_CONTEXT_KEY_ID_VALUE: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          EXPECTED_TENANT_CONTEXT_KEY_ID: ${{ needs.tenant-context-key-contract.outputs.production_key_id }}
          TENANT_CONTEXT_SECRET_VALUE: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_PREVIOUS_KEY_ID_VALUE: ${{ vars.TENANT_CONTEXT_PREVIOUS_KEY_ID }}
          TENANT_CONTEXT_PREVIOUS_SECRET_VALUE: ${{ secrets.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET }}
          TENANT_CONTEXT_RETIRE_PREVIOUS_KEY_VALUE: ${{ vars.TENANT_CONTEXT_RETIRE_PREVIOUS_KEY }}
          PRODUCTION_TENANT_CONTEXT_SECRET_SHA256: ${{ needs.tenant-context-key-contract.outputs.production_fingerprint }}
          PREVIEW_TENANT_CONTEXT_SECRET_SHA256: ${{ needs.tenant-context-key-contract.outputs.preview_fingerprint }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            VERCEL_TOKEN_VALUE NEON_API_KEY_VALUE NEON_DIRECT_URL_VALUE \
            METRICS_TOKEN_VALUE VERCEL_BYPASS_VALUE VERCEL_ORG_ID \
            VERCEL_PROJECT_ID PRODUCTION_URL NEON_PROJECT_ID_VALUE \
            NEON_BRANCH_ID_VALUE NEON_DATABASE_VALUE NEON_ROLE_VALUE \
            NEON_RUNTIME_ROLE_VALUE NEON_PLATFORM_ROLE_VALUE \
            TENANT_CONTEXT_KEY_ID_VALUE EXPECTED_TENANT_CONTEXT_KEY_ID \
            TENANT_CONTEXT_SECRET_VALUE \
            PRODUCTION_TENANT_CONTEXT_SECRET_SHA256 \
            PREVIEW_TENANT_CONTEXT_SECRET_SHA256; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required production configuration: ${missing[*]}" >&2
            exit 1
          fi
          if [ "${#METRICS_TOKEN_VALUE}" -lt 32 ]; then
            echo "METRICS_TOKEN must be at least 32 characters." >&2
            exit 1
          fi
          if [ "${#VERCEL_BYPASS_VALUE}" -lt 16 ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET must be at least 16 characters." >&2
            exit 1
          fi
          if ! [[ "$TENANT_CONTEXT_KEY_ID_VALUE" =~ ^[a-z0-9][a-z0-9._-]{0,31}$ ]]; then
            echo "TENANT_CONTEXT_SIGNING_KEY_ID has an invalid rotation identifier." >&2
            exit 1
          fi
          if [ "$TENANT_CONTEXT_KEY_ID_VALUE" != "$EXPECTED_TENANT_CONTEXT_KEY_ID" ]; then
            echo "Production TENANT_CONTEXT_SIGNING_KEY_ID does not match the reviewed key contract." >&2
            exit 1
          fi
          if ! [[ "$TENANT_CONTEXT_SECRET_VALUE" =~ ^[A-Za-z0-9_-]{43,128}$ ]]; then
            echo "TENANT_CONTEXT_SIGNING_SECRET must be a 43-128 character base64url secret." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const sha = process.env.TARGET_SHA || '';
          if (!/^[0-9a-f]{40}$/i.test(sha)) throw new Error('workflow_run did not provide a full commit SHA.');
          const productionUrl = new URL(process.env.PRODUCTION_URL);
          if (
            productionUrl.protocol !== 'https:' || productionUrl.pathname !== '/' ||
            productionUrl.search || productionUrl.hash || productionUrl.port ||
            productionUrl.username || productionUrl.password
          ) {
            throw new Error('PRODUCTION_URL must be a canonical HTTPS origin without credentials, a custom port, path, query, or fragment.');
          }
          const direct = new URL(process.env.NEON_DIRECT_URL_VALUE);
          const forbidden = new Set([
            'database', 'db', 'host', 'options', 'password', 'port', 'ssl',
            'sslcert', 'sslkey', 'sslnegotiation', 'sslpassword', 'sslrootcert',
            'user', 'uselibpqcompat'
          ]);
          const queryEntries = [...direct.searchParams.entries()];
          const forbiddenKeys = queryEntries
            .map(([key]) => key.toLowerCase())
            .filter((key) => forbidden.has(key));
          if (forbiddenKeys.length > 0) {
            throw new Error('NEON_PRODUCTION_DIRECT_URL must not contain connection identity, session, or TLS query overrides.');
          }
          const sslModes = queryEntries
            .filter(([key]) => key.toLowerCase() === 'sslmode')
            .map(([, value]) => value.toLowerCase());
          if (sslModes.length > 1 || sslModes.some((value) => value !== 'verify-full')) {
            throw new Error('NEON_PRODUCTION_DIRECT_URL may only specify sslmode=verify-full.');
          }
          const channelBindings = queryEntries
            .filter(([key]) => key.toLowerCase() === 'channel_binding')
            .map(([, value]) => value.toLowerCase());
          if (channelBindings.length > 1 || channelBindings.some((value) => value !== 'require')) {
            throw new Error('NEON_PRODUCTION_DIRECT_URL may only specify channel_binding=require.');
          }
          if (!direct.hostname.endsWith('.neon.tech') || direct.hostname.includes('-pooler')) {
            throw new Error('NEON_PRODUCTION_DIRECT_URL must use a direct Neon endpoint.');
          }
          if (direct.port && direct.port !== '5432') {
            throw new Error('NEON_PRODUCTION_DIRECT_URL must use PostgreSQL port 5432.');
          }
          if (decodeURIComponent(direct.username) !== process.env.NEON_ROLE_VALUE) {
            throw new Error('NEON_PRODUCTION_DIRECT_URL must use NEON_MIGRATION_ROLE.');
          }
          if (decodeURIComponent(direct.pathname.replace(/^\/+/, '')) !== process.env.NEON_DATABASE_VALUE) {
            throw new Error('NEON_PRODUCTION_DIRECT_URL must use NEON_DATABASE_NAME.');
          }
          for (const value of [process.env.NEON_PROJECT_ID_VALUE, process.env.NEON_BRANCH_ID_VALUE]) {
            if (!/^[A-Za-z0-9_-]+$/.test(value || '')) throw new Error('Neon IDs contain unsupported characters.');
          }
          for (const value of [process.env.NEON_DATABASE_VALUE, process.env.NEON_ROLE_VALUE, process.env.NEON_RUNTIME_ROLE_VALUE, process.env.NEON_PLATFORM_ROLE_VALUE]) {
            if (!/^[a-z_][a-z0-9_]{0,62}$/.test(value || '')) {
              throw new Error('Neon database and role names must be lowercase PostgreSQL identifiers.');
            }
          }
          if (process.env.NEON_PLATFORM_ROLE_VALUE !== 'school_sis_platform') {
            throw new Error('NEON_PLATFORM_ROLE must equal school_sis_platform.');
          }
          if (process.env.NEON_RUNTIME_ROLE_VALUE !== 'school_sis_runtime') {
            throw new Error('NEON_RUNTIME_ROLE must equal school_sis_runtime.');
          }
          if (new Set([
            process.env.NEON_ROLE_VALUE,
            process.env.NEON_RUNTIME_ROLE_VALUE,
            process.env.NEON_PLATFORM_ROLE_VALUE
          ]).size !== 3) {
            throw new Error('Migration, tenant-runtime, and platform-runtime roles must be distinct.');
          }
          const productionFingerprint = process.env.PRODUCTION_TENANT_CONTEXT_SECRET_SHA256 || '';
          const previewFingerprint = process.env.PREVIEW_TENANT_CONTEXT_SECRET_SHA256 || '';
          if (
            !/^[0-9a-f]{64}$/.test(productionFingerprint) ||
            !/^[0-9a-f]{64}$/.test(previewFingerprint) ||
            productionFingerprint === previewFingerprint
          ) {
            throw new Error('Production and preview tenant-context secret fingerprints must be valid and distinct.');
          }
          const actualFingerprint = createHash('sha256')
            .update(process.env.TENANT_CONTEXT_SECRET_VALUE, 'utf8')
            .digest('hex');
          if (actualFingerprint !== productionFingerprint) {
            throw new Error('Production tenant-context secret does not match its configured SHA-256 fingerprint.');
          }
          const previousKeyId = process.env.TENANT_CONTEXT_PREVIOUS_KEY_ID_VALUE || '';
          const previousSecret = process.env.TENANT_CONTEXT_PREVIOUS_SECRET_VALUE || '';
          const retirePrevious = process.env.TENANT_CONTEXT_RETIRE_PREVIOUS_KEY_VALUE || '';
          if (Boolean(previousKeyId) !== Boolean(previousSecret)) {
            throw new Error('TENANT_CONTEXT_PREVIOUS_KEY_ID and TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET must be configured together.');
          }
          if (previousKeyId && !/^[a-z0-9][a-z0-9._-]{0,31}$/.test(previousKeyId)) {
            throw new Error('TENANT_CONTEXT_PREVIOUS_KEY_ID has an invalid rotation identifier.');
          }
          if (previousSecret && !/^[A-Za-z0-9_-]{43,128}$/.test(previousSecret)) {
            throw new Error('TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET must be a 43-128 character base64url secret.');
          }
          if (previousKeyId === process.env.TENANT_CONTEXT_KEY_ID_VALUE && previousKeyId) {
            throw new Error('Current and previous tenant-context key IDs must differ.');
          }
          if (previousSecret === process.env.TENANT_CONTEXT_SECRET_VALUE && previousSecret) {
            throw new Error('Current and previous tenant-context secrets must differ.');
          }
          if (retirePrevious && retirePrevious !== 'true') {
            throw new Error('TENANT_CONTEXT_RETIRE_PREVIOUS_KEY must be unset or exactly true.');
          }
          if (retirePrevious === 'true' && previousKeyId) {
            throw new Error('TENANT_CONTEXT_RETIRE_PREVIOUS_KEY=true cannot be combined with a previous verification key.');
          }
          NODE

      - name: Wake the Neon production branch out of cold storage
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
        run: |
          set -euo pipefail
          # Neon archives branches that go idle. The gate below asserts
          # current_state == "ready", and Neon unarchives on DATA access only — a
          # management-API GET does not count. So the gate asserted a state that
          # nothing in this job would ever produce: the first real connection is
          # `db:migrate:deploy`, hundreds of lines further down, which the failed
          # assertion guarantees is never reached. It could not self-heal, and every
          # push to main died here in ~25s on "expected ready, got archived".
          #
          # This step does the one thing that unarchives a branch: it connects. It is
          # a no-op on a branch that is already ready, and it also returns an idle
          # compute endpoint to active for the endpoint assertion below.
          #
          # The assertions stay exactly as strict as they were — this makes the
          # precondition reachable, it does not weaken it.
          # Report the HTTP status instead of laundering an error body into data.
          #
          # Piping curl straight into jq made a rejected API key indistinguishable
          # from a branch that is merely not ready: an error body has no `.branch`,
          # so both fields fell back to their defaults and this returned the literal
          # string "unknown:null". That never equals "ready:null", so the settle
          # loop at the end of this step ran its full five minutes and then blamed
          # a stuck branch transition — for a credential the operator could have
          # fixed in a minute, had anything said so.
          neon_branch_file="$RUNNER_TEMP/neon-branch-state.json"
          branch_state() {
            local http
            http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
              --header "Authorization: Bearer $NEON_API_KEY" \
              --header 'Accept: application/json' \
              --output "$neon_branch_file" \
              --write-out '%{http_code}' \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_PRODUCTION_BRANCH_ID}")"
            if [ "$http" != "200" ]; then
              # A value no branch state can collide with, so every comparison in
              # this step treats it as the failure it is.
              echo "http-$http"
              return 0
            fi
            jq -r '"\(.branch.current_state // "unknown"):\(.branch.pending_state // "null")"' \
              "$neon_branch_file"
          }

          initial_state="$(branch_state)"
          case "$initial_state" in
            http-*)
              echo "Neon refused the branch query (HTTP ${initial_state#http-})." >&2
              echo "  project : $NEON_PROJECT_ID" >&2
              echo "  branch  : $NEON_PRODUCTION_BRANCH_ID" >&2
              echo "  response:" >&2
              head -c 400 "$neon_branch_file" | sed 's/^/    /' >&2 || true
              echo >&2
              echo "Stopping here rather than spending five minutes reporting a branch" >&2
              echo "transition that was never the problem." >&2
              exit 1
              ;;
          esac

          echo "Neon production branch state before wake: $initial_state"

          # Only wake a branch that actually needs it. If it already reports
          # ready, the blocker this step exists for does not apply, and the
          # assertions below run exactly as they always have.
          #
          # This matters more than it looks: the wake uses psql, while the release
          # migrates through node-postgres. Failing the release because psql on the
          # runner could not connect would block a deploy that would otherwise have
          # worked — trading the old blocker for a new one.
          if [ "$initial_state" = "ready:null" ]; then
            echo "Branch is already ready; nothing to wake."
            exit 0
          fi

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes --quiet postgresql-client
          fi

          # Capture the connection error instead of discarding it. The first version
          # of this step sent psql's stderr to /dev/null and reported only "not
          # accepting connections", which said nothing about WHY — the same silent
          # failure this file is being fixed to stop producing. GitHub masks the
          # registered secret in log output.
          psql_error="$RUNNER_TEMP/neon-wake-psql.err"
          connected=no
          for attempt in 1 2 3 4 5 6; do
            if PGCONNECT_TIMEOUT=30 psql "$NEON_DIRECT_URL" \
                 --quiet --no-psqlrc --tuples-only --command 'SELECT 1' \
                 >/dev/null 2>"$psql_error"; then
              connected=yes
              echo "Connected on attempt ${attempt}."
              break
            fi
            echo "Attempt ${attempt} failed (branch state $(branch_state)):"
            sed 's/^/    /' "$psql_error" || true
            sleep 20
          done

          if [ "$connected" != "yes" ]; then
            echo "Could not open a connection to the Neon production branch." >&2
            echo "  last psql error:" >&2
            sed 's/^/    /' "$psql_error" >&2 || true
            echo "  branch state: $(branch_state)" >&2
            # The most common cause is a stale NEON_PRODUCTION_DIRECT_URL: archiving
            # and unarchiving can reassign the compute endpoint. Print the hosts Neon
            # currently reports so the mismatch is visible without guesswork.
            echo "  host in NEON_PRODUCTION_DIRECT_URL: $(NEON_DIRECT_URL="$NEON_DIRECT_URL" node -e "process.stdout.write(new URL(process.env.NEON_DIRECT_URL).hostname)")" >&2
            # Same trap as branch_state: `.endpoints[]?` on an error body yields
            # nothing, so a refused key printed this heading followed by silence —
            # which reads as "Neon has no endpoints for this branch", the most
            # alarming possible misreading of "your token was rejected".
            endpoint_diag="$RUNNER_TEMP/neon-endpoint-diagnostic.json"
            endpoint_diag_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
              --header "Authorization: Bearer $NEON_API_KEY" \
              --header 'Accept: application/json' \
              --output "$endpoint_diag" \
              --write-out '%{http_code}' \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_PRODUCTION_BRANCH_ID}/endpoints")"
            if [ "$endpoint_diag_http" != "200" ]; then
              echo "  endpoints could not be read (HTTP $endpoint_diag_http):" >&2
              head -c 400 "$endpoint_diag" | sed 's/^/    /' >&2 || true
              echo >&2
            else
              echo "  endpoints Neon reports for this branch:" >&2
              endpoint_lines="$(jq -r '.endpoints[]? | "    \(.id) host=\(.host) type=\(.type) state=\(.current_state) disabled=\(.disabled)"' "$endpoint_diag")"
              if [ -n "$endpoint_lines" ]; then
                printf '%s\n' "$endpoint_lines" >&2
              else
                echo "    (Neon reports no endpoints on this branch)" >&2
              fi
            fi
            exit 1
          fi

          # Unarchiving surfaces through pending_state; let it settle so the assertion
          # below is not racing a branch that is still transitioning.
          for _ in $(seq 1 30); do
            state="$(branch_state)"
            if [ "$state" = "ready:null" ]; then
              echo "Neon production branch is ready."
              exit 0
            fi
            case "$state" in
              http-*)
                echo "Neon stopped answering branch queries (HTTP ${state#http-}); not waiting further." >&2
                head -c 400 "$neon_branch_file" | sed 's/^/    /' >&2 || true
                echo >&2
                exit 1
                ;;
            esac
            echo "Waiting for the branch to settle (state ${state})."
            sleep 10
          done
          echo "The branch did not reach ready within five minutes (state $(branch_state))." >&2
          exit 1

      - name: Bind the production URL to the configured Neon project and root branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
        run: |
          set -euo pipefail
          branch_file="$RUNNER_TEMP/neon-production-branch.json"
          endpoint_file="$RUNNER_TEMP/neon-production-endpoints.json"
          branch_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header 'Accept: application/json' \
            --output "$branch_file" \
            --write-out '%{http_code}' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_PRODUCTION_BRANCH_ID}")"
          endpoint_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header 'Accept: application/json' \
            --output "$endpoint_file" \
            --write-out '%{http_code}' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_PRODUCTION_BRANCH_ID}/endpoints")"
          if [ "$branch_http" != "200" ] || [ "$endpoint_http" != "200" ]; then
            echo "Could not verify the configured Neon production branch and endpoint." >&2
            exit 1
          fi
          # A bare `jq -e ... >/dev/null` exits 1 with no diagnostic, which makes a
          # production deploy failure undebuggable from the logs. Report exactly
          # which expectation the branch did not meet.
          if ! jq -e --arg project "$NEON_PROJECT_ID" --arg branch "$NEON_PRODUCTION_BRANCH_ID" \
            '.branch.id == $branch and
             .branch.project_id == $project and
             .branch.parent_id == null and
             .branch.default == true and
             .branch.protected == false and
             .branch.current_state == "ready" and
             .branch.pending_state == null' \
            "$branch_file" >/dev/null; then
            echo "The configured Neon production branch does not match what the release requires." >&2
            jq -r --arg project "$NEON_PROJECT_ID" --arg branch "$NEON_PRODUCTION_BRANCH_ID" '
              .branch as $b |
              [ (if $b.id            == $branch then empty else "  id: expected \($branch), got \($b.id)" end),
                (if $b.project_id    == $project then empty else "  project_id: expected \($project), got \($b.project_id)" end),
                (if $b.parent_id     == null then empty else "  parent_id: expected null (a root branch), got \($b.parent_id)" end),
                (if $b.default       == true then empty else "  default: expected true, got \($b.default)" end),
                (if $b.protected     == false then empty else "  protected: expected false, got \($b.protected) — Neon branch protection blocks the release migration" end),
                (if $b.current_state == "ready" then empty else "  current_state: expected ready, got \($b.current_state)" end),
                (if $b.pending_state == null then empty else "  pending_state: expected null, got \($b.pending_state) — the branch is still transitioning" end)
              ] | .[]' "$branch_file" >&2 || true
            exit 1
          fi
          direct_host="$(NEON_DIRECT_URL="$NEON_DIRECT_URL" node -e "process.stdout.write(new URL(process.env.NEON_DIRECT_URL).hostname)")"
          # The branch check above was given a diagnostic; this one was left bare and
          # is the more dangerous of the two. Run 32982743508 died right here with a
          # fully ready branch and produced NO log output whatsoever — exit 1, nothing
          # to read, nothing to act on. Report which endpoint failed which expectation.
          if ! jq -e \
            --arg project "$NEON_PROJECT_ID" \
            --arg branch "$NEON_PRODUCTION_BRANCH_ID" \
            --arg host "$direct_host" \
            '[.endpoints[] |
              select(
                .project_id == $project and
                .branch_id == $branch and
                .type == "read_write" and
                .host == $host and
                .disabled == false and
                (.current_state == "active" or .current_state == "idle") and
                .pending_state == null
              )] | length == 1' \
            "$endpoint_file" >/dev/null; then
            echo "No single read_write Neon endpoint matches the configured production URL." >&2
            echo "  NEON_PRODUCTION_DIRECT_URL host: $direct_host" >&2
            jq -r \
              --arg project "$NEON_PROJECT_ID" \
              --arg branch "$NEON_PRODUCTION_BRANCH_ID" \
              --arg host "$direct_host" '
              if (.endpoints | length) == 0 then
                "  the branch reports no compute endpoints at all"
              else
                (.endpoints[] |
                  . as $e |
                  [ (if $e.project_id == $project then empty else "project_id=\($e.project_id)" end),
                    (if $e.branch_id  == $branch  then empty else "branch_id=\($e.branch_id)" end),
                    (if $e.type == "read_write" then empty else "type=\($e.type) (expected read_write)" end),
                    (if $e.host == $host then empty else "host=\($e.host) (expected \($host))" end),
                    (if $e.disabled == false then empty else "disabled=true" end),
                    (if ($e.current_state == "active" or $e.current_state == "idle") then empty else "current_state=\($e.current_state) (expected active or idle)" end),
                    (if $e.pending_state == null then empty else "pending_state=\($e.pending_state) — still transitioning" end)
                  ] as $bad |
                  if ($bad | length) == 0
                  then "  endpoint \($e.id): matches"
                  else "  endpoint \($e.id): \($bad | join(", "))"
                  end)
              end' "$endpoint_file" >&2 || true
            exit 1
          fi

      - name: Checkout the successful main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify protected main release provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-production-release-provenance.mjs
          --repository "$GITHUB_REPOSITORY"
          --sha "$TARGET_SHA"
          --ref main

      - name: Verify triggering SHA and all required CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: >-
            ["validate","Tenant RLS Integration","Build & Lint","Migration Chain","Playwright Smoke"]
          REQUIRED_WORKFLOWS: '["CI/CD Pipeline","E2E Tests"]'
          EXPECTED_TRIGGER_WORKFLOW_RUN_ID: ${{ env.TRIGGER_RUN_ID }}
        run: |
          set -euo pipefail
          node scripts/wait-for-required-checks.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$TARGET_SHA" \
            --ref main \
            --trigger-workflow "E2E Tests" \
            --trigger-event push \
            --checks "$REQUIRED_CHECKS" \
            --workflows "$REQUIRED_WORKFLOWS" \
            --trigger-run-id "$TRIGGER_RUN_ID"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce production migration release policy
        run: |
          set -euo pipefail
          pnpm audit:migrations:release
          pnpm db:manifest:check

      - name: Verify pinned deployment tooling
        run: |
          set -euo pipefail
          configured_version="$(node -p "require('./package.json').devDependencies.vercel || ''")"
          if [ "$configured_version" != "59.0.0" ]; then
            echo "Root devDependency vercel must be pinned exactly to 59.0.0." >&2
            exit 1
          fi
          pnpm exec vercel --version | grep -Eq '(^|[^0-9])59\.0\.0([^0-9]|$)'

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify pooled Vercel runtime binding and credential separation
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          EXPECTED_RUNTIME_ROLE: ${{ vars.NEON_RUNTIME_ROLE }}
          EXPECTED_PLATFORM_ROLE: ${{ vars.NEON_PLATFORM_ROLE }}
          EXPECTED_TENANT_CONTEXT_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          EXPECTED_TENANT_CONTEXT_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          EXPECTED_TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { existsSync, readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';

          const linkCandidates = [
            '.vercel/project.json',
            'apps/web/.vercel/project.json'
          ].filter(existsSync);
          if (linkCandidates.length !== 1) {
            throw new Error(`Expected exactly one Vercel project link, found ${linkCandidates.length}.`);
          }
          const link = JSON.parse(readFileSync(linkCandidates[0], 'utf8'));
          if (
            link.orgId !== process.env.VERCEL_ORG_ID ||
            link.projectId !== process.env.VERCEL_PROJECT_ID
          ) {
            throw new Error('Pulled Vercel settings do not belong to the configured production project.');
          }

          const environmentPath = resolve(
            dirname(linkCandidates[0]),
            '.env.production.local'
          );
          if (!existsSync(environmentPath)) {
            throw new Error('Vercel did not create the production environment cache.');
          }
          const require = createRequire(resolve('apps/web/package.json'));
          const { parse } = require('dotenv');
          const pulled = parse(readFileSync(environmentPath));
          for (const forbidden of ['DIRECT_URL', 'DATABASE_URL_UNPOOLED']) {
            if (pulled[forbidden]) {
              throw new Error(`${forbidden} must be removed from Vercel; migration credentials belong only in GitHub.`);
            }
          }

          // `new URL(x || '')` throws a bare `TypeError: Invalid URL` naming no
          // variable, and GitHub masks the offending value as [SENSITIVE] because it
          // matches a registered secret. Run 33049217659 died exactly that way and
          // the log could not say which of five variables was at fault — only a stack
          // frame, eval1:37:18, that had to be mapped back to a line by hand.
          //
          // Report every missing variable at once, and name the invalid one. Values
          // are never echoed: these carry database passwords.
          const REQUIRED_FROM_VERCEL = [
            'DATABASE_URL',
            'PLATFORM_DATABASE_URL',
            'NEXT_PUBLIC_APP_URL',
            'TENANT_CONTEXT_AUDIENCE',
            'TENANT_CONTEXT_SIGNING_KEY_ID',
            'TENANT_CONTEXT_SIGNING_SECRET',
          ];
          const absent = REQUIRED_FROM_VERCEL.filter(
            (name) => typeof pulled[name] !== 'string' || pulled[name].trim() === ''
          );
          if (absent.length > 0) {
            throw new Error(
              `The Vercel production environment is missing ${absent.length} required ` +
              `variable(s): ${absent.join(', ')}. Set them on the Vercel project's ` +
              `Production environment, then re-run this release.`
            );
          }

          // Describe the SHAPE of an unparseable value, never its content.
          //
          // Naming the variable was not enough: run 33050771523 reported only that
          // PLATFORM_DATABASE_URL was invalid, which left the owner guessing at a
          // value nobody is allowed to read. These are the shapes that actually make
          // `new URL()` throw — each verified by running it, not assumed.
          //
          // Length is deliberately NOT reported. The host, username and database are
          // already known quantities, so a total length would give away the
          // password's length. Everything below is about format, not content.
          const describeShape = (value) => {
            const trimmed = value.trim();
            const notes = [];
            if (/^psql\b/i.test(trimmed)) {
              notes.push("it starts with `psql` — Neon's Connect dialog offers a psql command, so copy only the URL inside the quotes");
            }
            if (/^['"]/.test(trimmed) || /['"]$/.test(trimmed)) {
              notes.push('it is wrapped in quotes — paste the URL without them');
            }
            if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed)) {
              notes.push(`its scheme is "${trimmed.slice(0, trimmed.indexOf('://'))}"`);
            } else {
              notes.push('it has no scheme — a connection URL must begin with postgresql://');
            }
            if (/\bhost=|\buser=|\bdbname=/.test(trimmed)) {
              notes.push('it looks like libpq keyword format (host=... user=...) rather than a URL');
            }
            if (/\[[^\]]*\]|<[^>]*>/.test(trimmed)) {
              notes.push('it still contains a [PLACEHOLDER] — replace it with the real value');
            }
            if (/\s/.test(trimmed)) {
              notes.push('it contains a space or newline inside the value');
            }
            // Scheme present and nothing else obviously wrong: what is left is a
            // character inside the password that URL parsing cannot accept. `/` and
            // `#` both throw here; `@` does not — it parses and silently takes the
            // LAST `@` as the delimiter, so it fails the host check further down
            // rather than this one.
            if (notes.length === 1 && /^postgres(ql)?:\/\//.test(trimmed)) {
              notes.push('nothing else looks wrong, so a character in the password most likely needs percent-encoding — / becomes %2F, # becomes %23, : becomes %3A, ? becomes %3F, % becomes %25');
            }
            return notes;
          };
          const asUrl = (name, value, source) => {
            try {
              return new URL(value);
            } catch {
              const notes = describeShape(value);
              throw new Error(
                `${name} in ${source} is not a valid URL.` +
                (notes.length > 0 ? ` Detected: ${notes.join('; ')}.` : '') +
                ' Expected a bare connection URL of the form' +
                ' postgresql://ROLE:PASSWORD@HOST/DATABASE with no quotes and no command prefix.'
              );
            }
          };
          const VERCEL_ENV = 'the Vercel production environment';
          const runtime = asUrl('DATABASE_URL', pulled.DATABASE_URL, VERCEL_ENV);
          const platform = asUrl('PLATFORM_DATABASE_URL', pulled.PLATFORM_DATABASE_URL, VERCEL_ENV);
          const direct = asUrl('NEON_PRODUCTION_DIRECT_URL', process.env.NEON_DIRECT_URL, 'the GitHub Production environment');
          const configuredOrigin = asUrl('PRODUCTION_URL', process.env.PRODUCTION_URL, 'the GitHub repository variables');
          const applicationOrigin = asUrl('NEXT_PUBLIC_APP_URL', pulled.NEXT_PUBLIC_APP_URL, VERCEL_ENV);
          if (
            applicationOrigin.origin !== configuredOrigin.origin ||
            applicationOrigin.pathname !== '/' || applicationOrigin.search ||
            applicationOrigin.hash || applicationOrigin.username ||
            applicationOrigin.password
          ) {
            throw new Error('Vercel NEXT_PUBLIC_APP_URL must exactly match PRODUCTION_URL.');
          }
          if (
            !runtime.hostname.includes('-pooler.') ||
            runtime.hostname.replace('-pooler.', '.') !== direct.hostname ||
            decodeURIComponent(runtime.pathname) !== decodeURIComponent(direct.pathname)
          ) {
            throw new Error('Vercel DATABASE_URL and the GitHub direct URL must identify the same Neon branch and database.');
          }
          if (decodeURIComponent(runtime.username) !== process.env.EXPECTED_RUNTIME_ROLE) {
            throw new Error('Vercel DATABASE_URL does not use NEON_RUNTIME_ROLE.');
          }
          if (
            !platform.hostname.includes('-pooler.') ||
            platform.hostname !== runtime.hostname ||
            decodeURIComponent(platform.pathname) !== decodeURIComponent(runtime.pathname)
          ) {
            throw new Error('Vercel PLATFORM_DATABASE_URL must identify the same pooled Neon branch and database as DATABASE_URL.');
          }
          if (decodeURIComponent(platform.username) !== process.env.EXPECTED_PLATFORM_ROLE) {
            throw new Error('Vercel PLATFORM_DATABASE_URL does not use NEON_PLATFORM_ROLE.');
          }
          if (decodeURIComponent(platform.username) === decodeURIComponent(runtime.username)) {
            throw new Error('Vercel tenant and platform database URLs must use distinct roles.');
          }
          const passwords = [direct, runtime, platform].map((url) =>
            decodeURIComponent(url.password)
          );
          if (passwords.some((password) => password.length === 0) || new Set(passwords).size !== 3) {
            throw new Error('Migration, tenant-runtime, and platform-runtime database passwords must be nonempty and pairwise distinct.');
          }
          if (
            pulled.TENANT_CONTEXT_AUDIENCE !== process.env.EXPECTED_TENANT_CONTEXT_AUDIENCE ||
            pulled.TENANT_CONTEXT_SIGNING_KEY_ID !== process.env.EXPECTED_TENANT_CONTEXT_KEY_ID ||
            pulled.TENANT_CONTEXT_SIGNING_SECRET !== process.env.EXPECTED_TENANT_CONTEXT_SECRET
          ) {
            throw new Error('Vercel tenant-context signing credential does not match the protected GitHub Environment configuration.');
          }
          NODE

      - name: Build immutable production output before database mutation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TARGET_ENV: production
          DEPLOYMENT_RUNTIME_ROLE: ${{ vars.NEON_RUNTIME_ROLE }}
          DEPLOYMENT_PLATFORM_ROLE: ${{ vars.NEON_PLATFORM_ROLE }}
          TENANT_CONTEXT_SIGNING_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          TENANT_CONTEXT_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          DEPLOYMENT_MIGRATION_ROLE: ${{ vars.NEON_MIGRATION_ROLE }}
          DATABASE_SSL_MODE: verify-full
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GIT_COMMIT_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          pnpm exec vercel build --prod --yes --token="$VERCEL_TOKEN"

      - name: Prove production build output contains no credentials
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          TENANT_CONTEXT_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';

          const linkCandidates = ['.vercel/project.json', 'apps/web/.vercel/project.json'].filter(existsSync);
          const outputCandidates = ['.vercel/output', 'apps/web/.vercel/output'].filter(existsSync);
          if (linkCandidates.length !== 1 || outputCandidates.length !== 1) {
            throw new Error('Expected exactly one Vercel link and one production build output.');
          }
          const environmentPath = resolve(dirname(linkCandidates[0]), '.env.production.local');
          const require = createRequire(resolve('apps/web/package.json'));
          const { parse } = require('dotenv');
          const pulled = parse(readFileSync(environmentPath));
          const databaseValues = [pulled.DATABASE_URL, pulled.PLATFORM_DATABASE_URL, process.env.NEON_DIRECT_URL]
            .filter(Boolean);
          const needles = [
            ...databaseValues.flatMap((value) => [value, decodeURIComponent(new URL(value).password)]),
            process.env.TENANT_CONTEXT_SIGNING_SECRET,
            process.env.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET,
          ].filter((value) => typeof value === 'string' && value.length >= 12);
          const pending = [outputCandidates[0]];
          while (pending.length > 0) {
            const current = pending.pop();
            for (const entry of readdirSync(current)) {
              const path = join(current, entry);
              const stats = statSync(path);
              if (stats.isDirectory()) pending.push(path);
              if (!stats.isFile()) continue;
              const contents = readFileSync(path);
              if (needles.some((needle) => contents.includes(Buffer.from(needle)))) {
                throw new Error('The production build output contains a protected credential.');
              }
            }
          }
          NODE

      - name: Capture current production deployment for rollback
        id: prior
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          production_host="$(PRODUCTION_URL="$PRODUCTION_URL" node -e "process.stdout.write(new URL(process.env.PRODUCTION_URL).hostname)")"
          inspection="$RUNNER_TEMP/vercel-prior-production.json"
          inspection_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Accept: application/json' \
            --output "$inspection" \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v13/deployments/${production_host}?teamId=${VERCEL_ORG_ID}")"
          if [ "$inspection_http" != "200" ]; then
            echo "Could not resolve PRODUCTION_URL through the configured Vercel team (HTTP $inspection_http)." >&2
            exit 1
          fi
          # Resolving the hostname is itself the identity proof: the API hands
          # back whatever https://<production_host> serves at this moment. All
          # that is left to establish is that the deployment is ours, live, and
          # shaped like something `vercel rollback` will accept.
          #
          # The creation-time alias list is deliberately NOT consulted. `.alias`
          # records the domains a deployment was given when it was created, and
          # every candidate here is created with `--skip-domain`, which withholds
          # the canonical domain until the candidate has been verified. The list
          # is not empty — Vercel still records the project-scoped hostname it
          # assigns automatically — but it never contains PRODUCTION_URL's host.
          # Release 33096023694 captured exactly that:
          #   aliases : school-sis-web-singhaditya21s-projects.vercel.app
          # while PRODUCTION_URL is https://school-sis-web.vercel.app.
          #
          # Asserting the production host into that list made success poisonous:
          # release N+1 captured the deployment release N had promoted, found no
          # aliases on it, and `jq -e` exited 1 without printing a word. That is
          # what killed both releases after the first green one — each died here,
          # before any migration ran, saying nothing.
          resolved_id="$(jq -r '.id // ""' "$inspection")"
          resolved_project="$(jq -r '.projectId // ""' "$inspection")"
          resolved_target="$(jq -r '.target // "<none>"' "$inspection")"
          resolved_state="$(jq -r '.readyState // "<none>"' "$inspection")"
          resolved_url="$(jq -r '.url // ""' "$inspection")"
          resolved_aliases="$(jq -r '[.alias[]?] | join(", ")' "$inspection")"

          echo "$production_host currently serves:"
          echo "  deployment : ${resolved_id:-<none>}"
          echo "  url        : ${resolved_url:-<none>}"
          echo "  project    : ${resolved_project:-<none>}"
          echo "  target     : $resolved_target"
          echo "  readyState : $resolved_state"
          echo "  aliases    : ${resolved_aliases:-<none assigned at creation>}"

          capture_problems=0
          if [ "$resolved_project" != "$VERCEL_PROJECT_ID" ]; then
            echo "Live production belongs to project ${resolved_project:-<none>}, not $VERCEL_PROJECT_ID." >&2
            capture_problems=1
          fi
          if [ "$resolved_target" != "production" ]; then
            echo "Live production has target $resolved_target, expected production." >&2
            capture_problems=1
          fi
          if [ "$resolved_state" != "READY" ]; then
            echo "Live production is $resolved_state, expected READY." >&2
            capture_problems=1
          fi
          if ! printf '%s' "$resolved_id" | grep -Eq '^dpl_[A-Za-z0-9]+$'; then
            echo "Live production id \"${resolved_id:-<none>}\" is not a dpl_ identifier to roll back to." >&2
            capture_problems=1
          fi
          if [ -z "$resolved_url" ]; then
            echo "Live production reported no url to roll back to." >&2
            capture_problems=1
          fi
          if [ "$capture_problems" -ne 0 ]; then
            echo "Refusing to start a release without a usable rollback target." >&2
            exit 1
          fi

          echo "prior_id=$resolved_id" >> "$GITHUB_OUTPUT"
          echo "prior_url=$resolved_url" >> "$GITHUB_OUTPUT"

      - name: Re-verify protected main before Neon mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-production-release-provenance.mjs
          --repository "$GITHUB_REPOSITORY"
          --sha "$TARGET_SHA"
          --ref main

      - name: Create and verify Free-tier recovery branch checkpoint
        id: checkpoint
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
          TRIGGER_WORKFLOW_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          if ! [[ "$TRIGGER_WORKFLOW_CREATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "The triggering workflow creation time is not canonical UTC." >&2
            exit 1
          fi
          # workflow_run.created_at is immutable across reruns, so the exact
          # checkpoint can be reconciled safely after an interrupted attempt.
          #
          # That immutability is load-bearing, not incidental: a rerun finds its
          # checkpoint by exact name and assertNewCheckpointIdentity() in
          # create-neon-free-recovery-checkpoint.mjs requires the existing
          # branch's expires_at to EQUAL the value requested here. Computing this
          # from `now` would make every rerun of an interrupted release fail with
          # "does not have the exact requested expiration" — turning a recoverable
          # interruption into a hard stop. Do not "fix" it that way.
          #
          # The price is that a rerun of a run older than the retention window
          # computes an expiry already in the past. Say that plainly. Left alone,
          # the checkpoint script polls for 60 seconds and reports that the branch
          # "was not found", which names neither the cause nor the way out.
          expires_at="$(date -u -d "$TRIGGER_WORKFLOW_CREATED_AT +7 days" '+%Y-%m-%dT%H:%M:%SZ')"
          if [ "$(date -u -d "$expires_at" '+%s')" -le "$(date -u '+%s')" ]; then
            echo "This release cannot create a usable recovery checkpoint." >&2
            echo "  triggering run started : $TRIGGER_WORKFLOW_CREATED_AT" >&2
            echo "  checkpoint would expire: $expires_at (already past)" >&2
            echo "That timestamp is frozen so reruns reconcile onto the same checkpoint, so a" >&2
            echo "rerun this long after the original run cannot produce one that outlives the" >&2
            echo "release. Push a fresh commit to main and release that instead." >&2
            exit 1
          fi
          checkpoint_metadata="$RUNNER_TEMP/neon-free-recovery-checkpoint.json"
          node scripts/create-neon-free-recovery-checkpoint.mjs \
            --project-id "$NEON_PROJECT_ID" \
            --production-branch-id "$NEON_PRODUCTION_BRANCH_ID" \
            --sha "$TARGET_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --expires-at "$expires_at" \
            --attempts 60 \
            --delay-ms 1000 \
            > "$checkpoint_metadata"
          checkpoint_id="$(jq -er '.checkpointId | select(type == "string" and test("^br-[a-z0-9-]+$"))' "$checkpoint_metadata")"
          checkpoint_name="$(jq -er '.checkpointName | select(type == "string" and test("^recovery/pre-migrate-[0-9a-f]{12}-[1-9][0-9]*$"))' "$checkpoint_metadata")"
          jq -e \
            --arg id "$checkpoint_id" \
            --arg name "$checkpoint_name" \
            --arg source "$NEON_PRODUCTION_BRANCH_ID" \
            --arg expires "$expires_at" \
            '.checkpointId == $id and
             .checkpointName == $name and
             .sourceBranchId == $source and
             .expiresAt == $expires and
             .endpointCount == 0' \
            "$checkpoint_metadata" >/dev/null
          echo "checkpoint_id=$checkpoint_id" >> "$GITHUB_OUTPUT"
          echo "checkpoint_name=$checkpoint_name" >> "$GITHUB_OUTPUT"
          echo "metadata_path=$checkpoint_metadata" >> "$GITHUB_OUTPUT"
          {
            echo "### Pre-migration Neon Free recovery checkpoint"
            echo "- Branch: \`$checkpoint_id\`"
            echo "- Name: \`$checkpoint_name\`"
            echo "- Compute endpoints: \`0\`"
            echo "- Expires: \`$expires_at\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve recovery checkpoint metadata before migration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neon-pre-migration-recovery-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.checkpoint.outputs.metadata_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Apply locked production migrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          DATABASE_SSL_MODE: verify-full
          DEPLOYMENT_RUNTIME_ROLE: ${{ vars.NEON_RUNTIME_ROLE }}
          DEPLOYMENT_PLATFORM_ROLE: ${{ vars.NEON_PLATFORM_ROLE }}
          TENANT_CONTEXT_SIGNING_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          TENANT_CONTEXT_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          TENANT_CONTEXT_PREVIOUS_KEY_ID: ${{ vars.TENANT_CONTEXT_PREVIOUS_KEY_ID }}
          TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET }}
          TENANT_CONTEXT_RETIRE_PREVIOUS_KEY: ${{ vars.TENANT_CONTEXT_RETIRE_PREVIOUS_KEY }}
          CURRENT_PRODUCTION_DEPLOYMENT_ID: ${{ steps.prior.outputs.prior_id }}
          GIT_COMMIT_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          node scripts/verify-production-release-provenance.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$TARGET_SHA" \
            --ref main
          pnpm db:migrate:deploy -- --target production

      - name: Deploy prebuilt production candidate without assigning domains
        id: candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          TENANT_CONTEXT_SIGNING_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          TENANT_CONTEXT_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
        run: |
          set -euo pipefail
          deployment_json="$RUNNER_TEMP/vercel-production-candidate.json"
          pnpm exec vercel deploy \
            --prebuilt \
            --archive=tgz \
            --prod \
            --regions sin1 \
            --skip-domain \
            --yes \
            --json \
            --token="$VERCEL_TOKEN" \
            --meta "githubDeployment=1" \
            --meta "githubCommitRef=main" \
            --meta "gitCommitSha=$TARGET_SHA" \
            --meta "githubCommitSha=$TARGET_SHA" \
            --meta "githubCommitOrg=${{ github.repository_owner }}" \
            --meta "githubCommitRepo=${{ github.event.repository.name }}" \
            --meta "githubRunId=$GITHUB_RUN_ID" \
            --env METRICS_TOKEN \
            --env TENANT_CONTEXT_AUDIENCE \
            --env TENANT_CONTEXT_SIGNING_KEY_ID \
            --env TENANT_CONTEXT_SIGNING_SECRET \
            --env "GIT_COMMIT_SHA=$TARGET_SHA" \
            >"$deployment_json"
          candidate_url="$(jq -er '(.deployment // .).url | select(type == "string" and length > 0)' "$deployment_json")"
          candidate_id="$(jq -er '(.deployment // .).id | select(type == "string" and length > 0)' "$deployment_json")"
          case "$candidate_url" in
            https://*) ;;
            *) candidate_url="https://$candidate_url" ;;
          esac
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "candidate_id=$candidate_id" >> "$GITHUB_OUTPUT"

      - name: Verify staged production candidate
        id: candidate_verify
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.candidate_url }}
          EXPECTED_GIT_SHA: ${{ env.TARGET_SHA }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECTED_TENANT_CONTEXT_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          EXPECTED_TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          EXPECTED_VERCEL_REGION: sin1
        run: node scripts/verify-deployment.mjs --require-bypass true --attempts 18

      - name: Promote verified candidate
        id: promote
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
        run: |
          set -euo pipefail
          node scripts/verify-production-release-provenance.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$TARGET_SHA" \
            --ref main
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          pnpm exec vercel promote "$CANDIDATE_ID" --yes --timeout 5m --token="$VERCEL_TOKEN"

      - name: Verify canonical production after promotion
        id: canonical_verify
        env:
          DEPLOYMENT_URL: ${{ env.PRODUCTION_URL }}
          EXPECTED_GIT_SHA: ${{ env.TARGET_SHA }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECTED_TENANT_CONTEXT_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          EXPECTED_TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          EXPECTED_VERCEL_REGION: sin1
        run: node scripts/verify-deployment.mjs --attempts 18

      - name: Bind canonical production to the verified candidate
        id: bind
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
        run: |
          set -euo pipefail
          inspection="$RUNNER_TEMP/vercel-canonical-after-promotion.json"
          pnpm exec vercel inspect "$PRODUCTION_URL" --json --token="$VERCEL_TOKEN" >"$inspection"
          canonical_id="$(jq -er '(.id // .deployment.id) | select(type == "string" and length > 0)' "$inspection")"
          if [ "$canonical_id" != "$CANDIDATE_ID" ]; then
            echo "Canonical production does not point to the verified candidate." >&2
            exit 1
          fi

      - name: Record the promoted signing-runtime contract
        env:
          DIRECT_URL: ${{ secrets.NEON_PRODUCTION_DIRECT_URL }}
          DATABASE_SSL_MODE: verify-full
          TENANT_CONTEXT_SIGNING_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
        run: >-
          pnpm --filter @school-sis/web exec tsx
          scripts/mark-tenant-context-runtime.ts
          --sha "$TARGET_SHA"
          --deployment-id "${{ steps.candidate.outputs.candidate_id }}"
          --attested-key-id "${{ steps.canonical_verify.outputs.verified_tenant_context_key_id }}"
          --attested-audience "${{ steps.canonical_verify.outputs.verified_tenant_context_audience }}"

      # Roll back only while production is UNPROVEN.
      #
      # `bind` is the last step that proves production serves the verified
      # candidate, so once it has succeeded any later failure is bookkeeping and
      # must not revert a healthy release.
      #
      # This gate used to read `promote.outputs.attempted`, which is written
      # BEFORE `vercel promote` runs — so it was true for every failure that
      # followed a *successful* promotion. `Record the promoted signing-runtime
      # contract` writes one audit row over DIRECT_URL; a Neon compute suspend
      # there was enough to revert production to the previous deployment while
      # this release's migration stayed applied, leaving the database ahead of
      # the code. The candidate deletion below would then have removed the
      # healthy deployment permanently, and its live-production guard could not
      # object, because by then the rollback had made the *old* deployment live.
      #
      # Keying on `bind` also beats keying on the promote itself: promotion can
      # succeed while `Verify canonical production after promotion` finds
      # production unhealthy, and that case does need the rollback.
      - name: Roll back Vercel to captured production on promotion failure
        id: rollback
        if: >-
          failure() &&
          steps.promote.outputs.attempted == 'true' &&
          steps.bind.outcome != 'success' &&
          steps.prior.outputs.prior_id != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRIOR_DEPLOYMENT_ID: ${{ steps.prior.outputs.prior_id }}
          RECOVERY_CHECKPOINT_ID: ${{ steps.checkpoint.outputs.checkpoint_id }}
        run: |
          set -euo pipefail
          echo "Promotion failed; rolling Vercel back. Neon recovery branch $RECOVERY_CHECKPOINT_ID is retained for manual database recovery." >&2
          pnpm exec vercel rollback "$PRIOR_DEPLOYMENT_ID" --yes --timeout 5m --token="$VERCEL_TOKEN"

      - name: Verify rollback restored the captured deployment
        if: >-
          always() &&
          steps.rollback.outcome == 'success' &&
          steps.prior.outputs.prior_id != '' &&
          steps.promote.outputs.attempted == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRIOR_DEPLOYMENT_ID: ${{ steps.prior.outputs.prior_id }}
        run: |
          set -euo pipefail
          inspection="$RUNNER_TEMP/vercel-after-rollback.json"
          pnpm exec vercel inspect "$PRODUCTION_URL" --json --token="$VERCEL_TOKEN" >"$inspection"
          current_id="$(jq -er '(.id // .deployment.id) | select(type == "string" and length > 0)' "$inspection")"
          if [ "$current_id" != "$PRIOR_DEPLOYMENT_ID" ]; then
            echo "Canonical production does not point to the captured rollback deployment." >&2
            exit 1
          fi

      # Clean up unless production is proven to be ON the candidate.
      #
      # This used to require `rollback.outcome == 'success'`, which skipped the
      # one case that leaks: promotion attempted, rollback FAILED. The candidate
      # was then orphaned permanently — reconciliation here filters on this run's
      # githubRunId, and preview-cleanup.yml skips target=production entirely, so
      # nothing else would ever collect it. Run 33073717982 attempt 2 left
      # dpl_Exqhy2b1RCWoJ7jsPGhprYsbC2XM behind exactly that way.
      #
      # Keying on `bind` instead is both safer and simpler, and mirrors the
      # rollback gate above: bind succeeding is the only state in which the
      # candidate is known to be serving production. Every other state is either
      # safe to clean or protected by the live-production guard inside the step,
      # which resolves the host and refuses to delete whatever it finds.
      - name: Delete an unpromoted or rolled-back production candidate
        if: >-
          always() &&
          failure() &&
          steps.candidate.outcome != 'skipped' &&
          steps.bind.outcome != 'success' 
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
          CANDIDATE_STEP_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          set -euo pipefail
          candidate_ids="$RUNNER_TEMP/vercel-failed-candidate-ids.txt"
          : > "$candidate_ids"
          if [ -n "$CANDIDATE_ID" ]; then
            if ! [[ "$CANDIDATE_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
              echo "Ignoring malformed candidate output and reconciling through the Vercel API." >&2
            else
              echo "$CANDIDATE_ID" >> "$candidate_ids"
            fi
          fi
          deployment_json="$RUNNER_TEMP/vercel-production-candidate.json"
          if [ -s "$deployment_json" ]; then
            if parsed_candidate="$(jq -er '(.deployment // .).id | select(type == "string" and test("^dpl_[A-Za-z0-9]+$"))' "$deployment_json" 2>/dev/null)"; then
              echo "$parsed_candidate" >> "$candidate_ids"
            fi
          fi

          for attempt in 1 2 3; do
            list_file="$RUNNER_TEMP/vercel-production-candidates-${attempt}.json"
            list_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Accept: application/json' \
              --output "$list_file" \
              --write-out '%{http_code}' \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=100")"
            if [ "$list_http" != "200" ]; then
              echo "Candidate reconciliation failed with HTTP $list_http." >&2
              exit 1
            fi
            jq -r \
              --arg project "$VERCEL_PROJECT_ID" \
              --arg sha "$TARGET_SHA" \
              --arg run "$GITHUB_RUN_ID" \
              '.deployments[] |
               select(
                 .projectId == $project and .target == "production" and
                 .meta.githubCommitSha == $sha and .meta.githubRunId == $run
               ) |
               (.uid // .id) |
               select(type == "string" and test("^dpl_[A-Za-z0-9]+$"))' \
              "$list_file" >> "$candidate_ids"
            if [ "$attempt" != "3" ]; then sleep 5; fi
          done
          sort -u "$candidate_ids" -o "$candidate_ids"
          if [ ! -s "$candidate_ids" ]; then
            echo "Could not prove whether the $CANDIDATE_STEP_OUTCOME candidate step created a deployment. Manually reconcile Vercel project $VERCEL_PROJECT_ID for run $GITHUB_RUN_ID before the next release." >&2
            exit 1
          fi

          production_host="$(PRODUCTION_URL="$PRODUCTION_URL" node -e "process.stdout.write(new URL(process.env.PRODUCTION_URL).hostname)")"

          # Ask what production serves right now, and never delete that.
          #
          # This guard used to ask each candidate's own `.alias` list whether it
          # was production. Because every candidate is created with
          # `--skip-domain`, that list never contains the canonical production
          # host — only the project-scoped hostname Vercel assigns itself — even
          # once promotion has made the candidate live. So the answer was always
          # "not production" and the guard could never once have refused a
          # deletion. A safety net that cannot catch anything is more dangerous
          # than none, because it reads as one.
          live_production="$RUNNER_TEMP/vercel-live-production.json"
          live_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Accept: application/json' \
            --output "$live_production" \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v13/deployments/${production_host}?teamId=${VERCEL_ORG_ID}")"
          if [ "$live_http" != "200" ]; then
            echo "Could not resolve what $production_host serves (HTTP $live_http); refusing to delete any deployment." >&2
            exit 1
          fi
          live_id="$(jq -r '.id // ""' "$live_production")"
          if [ -z "$live_id" ]; then
            echo "Resolving $production_host returned no deployment id; refusing to delete any deployment." >&2
            exit 1
          fi
          echo "Live production is $live_id and will not be deleted."

          while IFS= read -r candidate_id; do
            candidate_file="$RUNNER_TEMP/vercel-failed-candidate-${candidate_id}.json"
            candidate_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Accept: application/json' \
              --output "$candidate_file" \
              --write-out '%{http_code}' \
              "https://api.vercel.com/v13/deployments/${candidate_id}?teamId=${VERCEL_ORG_ID}")"
            if [ "$candidate_http" = "404" ]; then
              continue
            fi
            if [ "$candidate_http" != "200" ]; then
              echo "Could not verify failed candidate ownership (HTTP $candidate_http)." >&2
              exit 1
            fi
            if [ "$candidate_id" = "$live_id" ]; then
              echo "Candidate $candidate_id is what production currently serves; refusing to delete it." >&2
              exit 1
            fi
            if ! jq -e \
              --arg id "$candidate_id" \
              --arg project "$VERCEL_PROJECT_ID" \
              --arg sha "$TARGET_SHA" \
              --arg run "$GITHUB_RUN_ID" \
              '.id == $id and .projectId == $project and .target == "production" and
               .meta.githubCommitSha == $sha and .meta.githubRunId == $run' \
              "$candidate_file" >/dev/null; then
              seen_project="$(jq -r '.projectId // "<none>"' "$candidate_file")"
              seen_target="$(jq -r '.target // "<none>"' "$candidate_file")"
              seen_sha="$(jq -r '.meta.githubCommitSha // "<none>"' "$candidate_file")"
              seen_run="$(jq -r '.meta.githubRunId // "<none>"' "$candidate_file")"
              echo "Refusing to delete $candidate_id: it is not a production deployment this run created." >&2
              echo "  project=$seen_project target=$seen_target sha=$seen_sha run=$seen_run" >&2
              exit 1
            fi

            delete_file="$RUNNER_TEMP/vercel-failed-candidate-delete-${candidate_id}.json"
            set +e
            delete_http="$(curl --silent --show-error --max-time 30 \
              --request DELETE \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Accept: application/json' \
              --output "$delete_file" \
              --write-out '%{http_code}' \
              "https://api.vercel.com/v13/deployments/${candidate_id}?teamId=${VERCEL_ORG_ID}")"
            delete_status=$?
            set -e
            if [ "$delete_status" -ne 0 ]; then
              echo "Candidate deletion had an ambiguous transport failure; inspect $candidate_id." >&2
              exit 1
            fi
            case "$delete_http" in
              200|204|404) ;;
              *)
                echo "Candidate deletion failed with HTTP $delete_http." >&2
                exit 1
                ;;
            esac
          done < "$candidate_ids"

      # Always say what production is serving, whatever happened above.
      #
      # When a rollback failed, every closing step was gated off: the rollback
      # verification requires `rollback.outcome == 'success'`, and so did the
      # cleanup. So the single state that most needs a statement of fact —
      # promotion attempted, rollback failed, migration already applied — ended
      # with "Process completed with exit code 1" and nothing else. Run
      # 33073717982 attempt 2 ended exactly that way: nowhere in that log does it
      # say what PRODUCTION_URL resolved to.
      #
      # Deliberately does not use the Vercel CLI. This has to work when the rest
      # of the job did not, and `vercel inspect` resolves scope through
      # GET /v2/user, which has already returned 404 in this project. It uses the
      # same REST call the capture step uses, with an explicit teamId.
      #
      # It is a diagnostic, so it never fails the job.
      - name: Report what production is serving
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRIOR_DEPLOYMENT_ID: ${{ steps.prior.outputs.prior_id }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/vercel-final-production.json"

          if ! production_host="$(PRODUCTION_URL="$PRODUCTION_URL" node -e "process.stdout.write(new URL(process.env.PRODUCTION_URL).hostname)")"; then
            echo "Could not parse PRODUCTION_URL; cannot report what production serves." >&2
            exit 0
          fi

          http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Accept: application/json' \
            --output "$report" \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v13/deployments/${production_host}?teamId=${VERCEL_ORG_ID}")" || http="000"

          if [ "$http" != "200" ]; then
            echo "Could not resolve $production_host (HTTP $http); production state is UNKNOWN." >&2
            exit 0
          fi

          live_id="$(jq -r '.id // "<none>"' "$report")"
          live_url="$(jq -r '.url // "<none>"' "$report")"
          live_state="$(jq -r '.readyState // "<none>"' "$report")"
          live_sha="$(jq -r '.meta.githubCommitSha // "<none>"' "$report")"

          verdict="production is on NEITHER this release's candidate nor the captured rollback target"
          if [ -n "${CANDIDATE_ID:-}" ] && [ "$live_id" = "$CANDIDATE_ID" ]; then
            verdict="production is on THIS release's candidate"
          elif [ -n "${PRIOR_DEPLOYMENT_ID:-}" ] && [ "$live_id" = "$PRIOR_DEPLOYMENT_ID" ]; then
            verdict="production is on the deployment captured before this release"
          fi

          {
            echo "$production_host is serving:"
            echo "  deployment        : $live_id"
            echo "  url               : $live_url"
            echo "  readyState        : $live_state"
            echo "  commit            : $live_sha"
            echo "  this release built: ${CANDIDATE_ID:-<no candidate>} from $TARGET_SHA"
            echo "  captured rollback : ${PRIOR_DEPLOYMENT_ID:-<none captured>}"
            echo "  => $verdict."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
