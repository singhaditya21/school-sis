name: Preview Environment

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build, migrate, and deploy isolated preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    env:
      NODE_VERSION: "24"
      PNPM_VERSION: "9.15.9"
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PREVIEW_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_PREVIEW_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PREVIEW_PROJECT_ID }}
      DATABASE_SSL_MODE: verify-full
      RATE_LIMIT_BACKEND: postgres
      INTEGRATIONS_MODE: live
      JOB_QUEUE_MODE: database
      CSP_ENFORCE: "true"

    steps:
      - name: Fail closed on missing preview configuration
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          NEON_API_KEY_VALUE: ${{ secrets.NEON_PREVIEW_API_KEY }}
          VERCEL_BYPASS_VALUE: ${{ secrets.VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET }}
          NEON_PROJECT_ID_VALUE: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          NEON_PREVIEW_PARENT_VALUE: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          NEON_DATABASE_VALUE: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          NEON_ROLE_VALUE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          NEON_RUNTIME_ROLE_VALUE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          PREVIEW_APP_URL_TEMPLATE_VALUE: ${{ vars.VERCEL_PREVIEW_APP_URL_TEMPLATE }}
          PRODUCTION_VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            VERCEL_TOKEN_VALUE NEON_API_KEY_VALUE \
            VERCEL_BYPASS_VALUE VERCEL_ORG_ID VERCEL_PROJECT_ID \
            NEON_PROJECT_ID_VALUE NEON_PREVIEW_PARENT_VALUE \
            NEON_DATABASE_VALUE NEON_ROLE_VALUE NEON_RUNTIME_ROLE_VALUE \
            PREVIEW_APP_URL_TEMPLATE_VALUE PREVIEW_PR_NUMBER \
            PRODUCTION_VERCEL_ORG_ID PRODUCTION_VERCEL_PROJECT_ID \
            PRODUCTION_NEON_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required preview configuration: ${missing[*]}" >&2
            exit 1
          fi
          if [ "${#VERCEL_BYPASS_VALUE}" -lt 16 ]; then
            echo "VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET must be at least 16 characters." >&2
            exit 1
          fi
          if [ "$VERCEL_ORG_ID" = "$PRODUCTION_VERCEL_ORG_ID" ] || \
             [ "$VERCEL_PROJECT_ID" = "$PRODUCTION_VERCEL_PROJECT_ID" ]; then
            echo "Preview Vercel must use a separate team and project that cannot affect production." >&2
            exit 1
          fi
          if [ "$NEON_PROJECT_ID_VALUE" = "$PRODUCTION_NEON_PROJECT_ID" ]; then
            echo "Preview Neon must use a separate project with no production data or branches." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          const identifiers = [
            'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID', 'NEON_PROJECT_ID_VALUE',
            'NEON_PREVIEW_PARENT_VALUE'
          ];
          for (const name of identifiers) {
            if (!/^[A-Za-z0-9_-]+$/.test(process.env[name] || '')) {
              throw new Error(`${name} contains unsupported characters.`);
            }
          }
          for (const name of ['NEON_DATABASE_VALUE', 'NEON_ROLE_VALUE', 'NEON_RUNTIME_ROLE_VALUE']) {
            if (!/^[a-z_][a-z0-9_]{0,62}$/.test(process.env[name] || '')) {
              throw new Error(`${name} must be a lowercase PostgreSQL identifier.`);
            }
          }
          if (process.env.NEON_ROLE_VALUE === process.env.NEON_RUNTIME_ROLE_VALUE) {
            throw new Error('Preview migration and runtime roles must be distinct.');
          }
          const template = process.env.PREVIEW_APP_URL_TEMPLATE_VALUE;
          if ((template.match(/\{pr\}/g) || []).length !== 1) {
            throw new Error('VERCEL_PREVIEW_APP_URL_TEMPLATE must contain exactly one {pr} placeholder.');
          }
          if (!/^[1-9][0-9]*$/.test(process.env.PREVIEW_PR_NUMBER || '')) {
            throw new Error('Preview pull-request number is invalid.');
          }
          const appUrl = new URL(template.replace('{pr}', process.env.PREVIEW_PR_NUMBER));
          if (
            appUrl.protocol !== 'https:' || appUrl.pathname !== '/' ||
            appUrl.search || appUrl.hash || appUrl.port ||
            appUrl.username || appUrl.password ||
            !/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(appUrl.hostname)
          ) {
            throw new Error('VERCEL_PREVIEW_APP_URL_TEMPLATE must produce a canonical HTTPS origin.');
          }
          const { appendFileSync } = await import('node:fs');
          appendFileSync(
            process.env.GITHUB_ENV,
            `NEXT_PUBLIC_APP_URL=${appUrl.origin}\nTENANT_BASE_HOSTS=${appUrl.hostname}\nPREVIEW_ALIAS_HOST=${appUrl.hostname}\n`,
          );
          NODE

      - name: Generate per-run preview application secrets
        run: |
          set -euo pipefail
          for name in SESSION_SECRET PII_ENCRYPTION_KEY JOB_DISPATCH_SECRET METRICS_TOKEN; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Checkout approved pull-request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned deployment tooling
        run: |
          set -euo pipefail
          configured_version="$(node -p "require('./package.json').devDependencies.vercel || ''")"
          if [ "$configured_version" != "59.0.0" ]; then
            echo "Root devDependency vercel must be pinned exactly to 59.0.0." >&2
            exit 1
          fi
          pnpm exec vercel --version | grep -Eq '(^|[^0-9])59\.0\.0([^0-9]|$)'

      - name: Set preview database expiry backstop
        id: expiry
        run: echo "expires_at=$(date -u -d '+1 day' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse schema-only Neon branch for migrations
        id: neon_migration
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          api_key: ${{ secrets.NEON_PREVIEW_API_KEY }}
          project_id: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          branch_name: ${{ env.PREVIEW_BRANCH_NAME }}
          branch_type: schema-only
          database: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          role: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          ssl: verify-full
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Resolve pooled Neon URL for the runtime role
        id: neon_runtime
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          api_key: ${{ secrets.NEON_PREVIEW_API_KEY }}
          project_id: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          branch_name: ${{ env.PREVIEW_BRANCH_NAME }}
          branch_type: schema-only
          database: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          role: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          ssl: verify-full
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Validate Neon action outputs
        env:
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          EXPECTED_PARENT_BRANCH_ID: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          EXPECTED_BRANCH_NAME: ${{ env.PREVIEW_BRANCH_NAME }}
          PREVIEW_DIRECT_URL: ${{ steps.neon_migration.outputs.db_url }}
          PREVIEW_POOLED_URL: ${{ steps.neon_runtime.outputs.db_url_pooled }}
          PREVIEW_MIGRATION_BRANCH_ID: ${{ steps.neon_migration.outputs.branch_id }}
          PREVIEW_RUNTIME_BRANCH_ID: ${{ steps.neon_runtime.outputs.branch_id }}
          EXPECTED_MIGRATION_ROLE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          EXPECTED_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = [
            'PREVIEW_DIRECT_URL', 'PREVIEW_POOLED_URL',
            'PREVIEW_MIGRATION_BRANCH_ID', 'PREVIEW_RUNTIME_BRANCH_ID',
            'EXPECTED_MIGRATION_ROLE', 'EXPECTED_RUNTIME_ROLE'
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Neon action did not return ${name}.`);
          }
          const direct = new URL(process.env.PREVIEW_DIRECT_URL);
          const pooled = new URL(process.env.PREVIEW_POOLED_URL);
          if (process.env.PREVIEW_MIGRATION_BRANCH_ID !== process.env.PREVIEW_RUNTIME_BRANCH_ID) {
            throw new Error('Neon migration and runtime URLs do not belong to the same branch.');
          }
          if (!direct.hostname.endsWith('.neon.tech') || direct.hostname.includes('-pooler')) {
            throw new Error('Neon direct URL output is not a direct Neon endpoint.');
          }
          if (!pooled.hostname.endsWith('.neon.tech') || !pooled.hostname.includes('-pooler')) {
            throw new Error('Neon pooled URL output is not a pooled Neon endpoint.');
          }
          if (decodeURIComponent(direct.username) !== process.env.EXPECTED_MIGRATION_ROLE) {
            throw new Error('Neon direct URL does not use the configured migration role.');
          }
          if (decodeURIComponent(pooled.username) !== process.env.EXPECTED_RUNTIME_ROLE) {
            throw new Error('Neon pooled URL does not use the configured runtime role.');
          }
          NODE

          branch_file="$RUNNER_TEMP/neon-preview-branch.json"
          branch_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header 'Accept: application/json' \
            --output "$branch_file" \
            --write-out '%{http_code}' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${PREVIEW_MIGRATION_BRANCH_ID}")"
          if [ "$branch_http" != "200" ]; then
            echo "Could not verify the isolated Neon preview branch." >&2
            exit 1
          fi
          jq -e \
            --arg id "$PREVIEW_MIGRATION_BRANCH_ID" \
            --arg parent "$EXPECTED_PARENT_BRANCH_ID" \
            --arg name "$EXPECTED_BRANCH_NAME" \
            '.branch.id == $id and .branch.parent_id == $parent and .branch.name == $name and (.branch.expires_at | type == "string")' \
            "$branch_file" >/dev/null

      - name: Pull Vercel preview settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          DATABASE_URL: ${{ steps.neon_runtime.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon_migration.outputs.db_url }}
          DEPLOYMENT_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          DEPLOYMENT_MIGRATION_ROLE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          EXPECTED_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET }}
          GIT_COMMIT_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          pnpm exec vercel pull \
            --yes \
            --environment=preview \
            --git-branch="$PR_HEAD_REF" \
            --token="$VERCEL_TOKEN"

          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import {
            existsSync, readFileSync, readdirSync, rmSync, writeFileSync
          } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';

          const linkCandidates = [
            '.vercel/project.json',
            'apps/web/.vercel/project.json'
          ].filter(existsSync);
          if (linkCandidates.length !== 1) {
            throw new Error(`Expected exactly one Vercel project link, found ${linkCandidates.length}.`);
          }
          const link = JSON.parse(readFileSync(linkCandidates[0], 'utf8'));
          if (
            link.orgId !== process.env.VERCEL_ORG_ID ||
            link.projectId !== process.env.VERCEL_PROJECT_ID
          ) {
            throw new Error('Pulled Vercel settings do not belong to the configured preview project.');
          }

          const environmentPath = join(dirname(linkCandidates[0]), '.env.preview.local');
          if (!existsSync(environmentPath)) {
            throw new Error('Vercel did not create the preview environment cache.');
          }
          const require = createRequire(resolve('apps/web/package.json'));
          const { parse } = require('dotenv');
          const pulled = parse(readFileSync(environmentPath));
          const allowedPulledNames = new Set([
            'CI', 'ENABLE_EXPERIMENTAL_COREPACK', 'VERCEL', 'VERCEL_BRANCH_URL',
            'VERCEL_AUTOMATION_BYPASS_SECRET',
            'VERCEL_DEPLOYMENT_ID', 'VERCEL_ENV', 'VERCEL_OIDC_TOKEN',
            'VERCEL_PROJECT_ID', 'VERCEL_PROJECT_NAME',
            'VERCEL_PROJECT_PRODUCTION_URL', 'VERCEL_REGION',
            'VERCEL_SKEW_PROTECTION_ENABLED', 'VERCEL_TARGET_ENV', 'VERCEL_URL'
          ]);
          const unexpected = Object.keys(pulled).filter(
            (name) =>
              !allowedPulledNames.has(name) &&
              !/^VERCEL_GIT_[A-Z0-9_]+$/.test(name),
          );
          if (unexpected.length > 0) {
            throw new Error(
              `Preview Vercel project contains persistent application variables; remove them before deploying: ${unexpected.sort().join(', ')}`,
            );
          }
          if (
            pulled.ENABLE_EXPERIMENTAL_COREPACK !== undefined &&
            pulled.ENABLE_EXPERIMENTAL_COREPACK !== '1'
          ) {
            throw new Error('Preview ENABLE_EXPERIMENTAL_COREPACK must equal 1 when configured.');
          }
          if (
            pulled.VERCEL_AUTOMATION_BYPASS_SECRET !== undefined &&
            pulled.VERCEL_AUTOMATION_BYPASS_SECRET !== process.env.EXPECTED_VERCEL_BYPASS_SECRET
          ) {
            throw new Error('Preview Vercel automation bypass does not match the protected GitHub Environment secret.');
          }

          for (const directory of ['.vercel', 'apps/web/.vercel']) {
            if (!existsSync(directory)) continue;
            for (const entry of readdirSync(directory)) {
              if (/^\.env(?:\..+)?\.local$/.test(entry)) rmSync(join(directory, entry));
            }
          }

          const environmentNames = [
            'DATABASE_URL', 'DIRECT_URL', 'DEPLOYMENT_RUNTIME_ROLE',
            'DEPLOYMENT_MIGRATION_ROLE', 'DATABASE_SSL_MODE', 'SESSION_SECRET',
            'PII_ENCRYPTION_KEY', 'JOB_DISPATCH_SECRET', 'METRICS_TOKEN',
            'NEXT_PUBLIC_APP_URL', 'TENANT_BASE_HOSTS', 'RATE_LIMIT_BACKEND',
            'INTEGRATIONS_MODE', 'JOB_QUEUE_MODE', 'CSP_ENFORCE', 'GIT_COMMIT_SHA'
          ];
          const lines = environmentNames.map((name) => {
            const value = process.env[name];
            if (!value) throw new Error(`Missing isolated preview value ${name}.`);
            return `${name}=${JSON.stringify(value)}`;
          });
          writeFileSync(environmentPath, `${lines.join('\n')}\n`, { mode: 0o600 });
          NODE

      - name: Build, then migrate the isolated preview database
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          VERCEL_TARGET_ENV: preview
          DATABASE_URL: ${{ steps.neon_runtime.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.neon_migration.outputs.db_url }}
          DEPLOYMENT_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          DEPLOYMENT_MIGRATION_ROLE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          GIT_COMMIT_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          pnpm exec vercel build --target=preview --yes --token="$VERCEL_TOKEN"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          const outputCandidates = [
            '.vercel/output',
            'apps/web/.vercel/output'
          ].filter(existsSync);
          if (outputCandidates.length !== 1) {
            throw new Error(`Expected exactly one Vercel build output, found ${outputCandidates.length}.`);
          }
          const directUrl = process.env.DIRECT_URL;
          const directPassword = decodeURIComponent(new URL(directUrl).password);
          const needles = [directUrl, directPassword].filter((value) => value.length >= 12);
          const pending = [outputCandidates[0]];
          while (pending.length > 0) {
            const current = pending.pop();
            for (const entry of readdirSync(current)) {
              const path = join(current, entry);
              const stats = statSync(path);
              if (stats.isDirectory()) pending.push(path);
              if (!stats.isFile()) continue;
              const contents = readFileSync(path);
              if (needles.some((needle) => contents.includes(Buffer.from(needle)))) {
                throw new Error('The preview build output contains a direct migration credential.');
              }
            }
          }
          NODE

      - name: Deploy prebuilt preview with pooled runtime connection only
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          DATABASE_URL: ${{ steps.neon_runtime.outputs.db_url_pooled }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          deployment_json="$RUNNER_TEMP/vercel-preview-deployment.json"
          pnpm exec vercel deploy \
            --prebuilt \
            --target=preview \
            --yes \
            --json \
            --token="$VERCEL_TOKEN" \
            --meta "githubDeployment=1" \
            --meta "githubCommitRef=$PR_HEAD_REF" \
            --meta "gitCommitSha=$TARGET_SHA" \
            --meta "githubCommitSha=$TARGET_SHA" \
            --meta "githubCommitOrg=${{ github.repository_owner }}" \
            --meta "githubCommitRepo=${{ github.event.repository.name }}" \
            --meta "githubPrId=${{ github.event.pull_request.number }}" \
            --meta "schoolSisPreview=1" \
            --env DATABASE_URL \
            --env "DATABASE_SSL_MODE=verify-full" \
            --env "RATE_LIMIT_BACKEND=postgres" \
            --env SESSION_SECRET \
            --env PII_ENCRYPTION_KEY \
            --env JOB_DISPATCH_SECRET \
            --env METRICS_TOKEN \
            --env NEXT_PUBLIC_APP_URL \
            --env TENANT_BASE_HOSTS \
            --env "INTEGRATIONS_MODE=live" \
            --env "JOB_QUEUE_MODE=database" \
            --env "CSP_ENFORCE=true" \
            --env "GIT_COMMIT_SHA=$TARGET_SHA" \
            >"$deployment_json"
          deployment_url="$(jq -er '(.deployment // .).url | select(type == "string" and length > 0)' "$deployment_json")"
          deployment_id="$(jq -er '(.deployment // .).id | select(type == "string" and length > 0)' "$deployment_json")"
          case "$deployment_url" in
            https://*) ;;
            *) deployment_url="https://$deployment_url" ;;
          esac
          pnpm exec vercel alias set \
            "$deployment_id" \
            "$PREVIEW_ALIAS_HOST" \
            --token="$VERCEL_TOKEN"
          deployment_url="$NEXT_PUBLIC_APP_URL"
          unset VERCEL_TOKEN
          node scripts/verify-deployment.mjs \
            --base-url "$deployment_url" \
            --sha "$TARGET_SHA" \
            --attempts 18 \
            --require-bypass true
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Create or update pull-request preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
          PREVIEW_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          marker='<!-- school-sis-vercel-preview -->'
          body="${marker}
          <!-- school-sis-vercel-deployment:${PREVIEW_DEPLOYMENT_ID} -->
          Preview is ready: ${PREVIEW_URL}

          Commit: \`${TARGET_SHA}\`
          Database: isolated schema-only Neon branch \`${PREVIEW_BRANCH_NAME}\`"
          comment_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            --jq 'map(select(.body | contains("<!-- school-sis-vercel-preview -->")))[0].id // empty')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="$body" >/dev/null
          fi
