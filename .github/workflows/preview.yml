name: Preview Environment

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tenant-context-key-contract:
    name: Pin distinct tenant-context key fingerprints
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      production_fingerprint: ${{ steps.pins.outputs.production_fingerprint }}
      production_key_id: ${{ steps.pins.outputs.production_key_id }}
      preview_fingerprint: ${{ steps.pins.outputs.preview_fingerprint }}
      preview_key_id: ${{ steps.pins.outputs.preview_key_id }}
    steps:
      - name: Read the reviewed key contract from protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      # This job deliberately has no GitHub Environment. Both protected jobs
      # consume the same reviewed file, so environment variable precedence
      # cannot present a different key/fingerprint pair to each deployment.
      - name: Validate tracked signing-key contract
        id: pins
        env:
          PINNED_PRODUCTION_FINGERPRINT: ${{ vars.PRODUCTION_TENANT_CONTEXT_SIGNING_SECRET_SHA256 }}
          PINNED_PREVIEW_FINGERPRINT: ${{ vars.PREVIEW_TENANT_CONTEXT_SIGNING_SECRET_SHA256 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const exactKeys = (value, keys, label) => {
            if (!value || typeof value !== 'object' || Array.isArray(value) ||
                JSON.stringify(Object.keys(value).sort()) !== JSON.stringify([...keys].sort())) {
              throw new Error(`${label} has unexpected or missing keys.`);
            }
          };
          const contract = JSON.parse(readFileSync('.github/tenant-context-key-contract.json', 'utf8'));
          exactKeys(contract, ['version', 'production', 'preview'], 'tenant-context key contract');
          if (contract.version !== 1) throw new Error('Unsupported tenant-context key contract version.');
          for (const environment of ['production', 'preview']) {
            const entry = contract[environment];
            exactKeys(entry, ['keyId', 'secretSha256'], `${environment} tenant-context key contract`);
            if (!/^[a-z0-9][a-z0-9._-]{0,31}$/.test(entry.keyId) ||
                !/^[0-9a-f]{64}$/.test(entry.secretSha256)) {
              throw new Error(`${environment} tenant-context key contract is malformed.`);
            }
          }
          if (contract.production.keyId === contract.preview.keyId ||
              contract.production.secretSha256 === contract.preview.secretSha256) {
            throw new Error('Production and preview tenant-context key contracts must be distinct.');
          }
          if (contract.production.secretSha256 !== process.env.PINNED_PRODUCTION_FINGERPRINT ||
              contract.preview.secretSha256 !== process.env.PINNED_PREVIEW_FINGERPRINT) {
            throw new Error('Tracked tenant-context fingerprints do not match the shared repository pins.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `production_fingerprint=${contract.production.secretSha256}\n` +
            `production_key_id=${contract.production.keyId}\n` +
            `preview_fingerprint=${contract.preview.secretSha256}\n` +
            `preview_key_id=${contract.preview.keyId}\n`);
          NODE

  deploy-preview:
    name: Build, migrate, and deploy isolated preview
    needs: tenant-context-key-contract
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    env:
      NODE_VERSION: "24"
      PNPM_VERSION: "9.15.9"
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PREVIEW_BRANCH_NAME: preview/pr-${{ github.event.pull_request.number }}
      PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_PREVIEW_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PREVIEW_PROJECT_ID }}
      DATABASE_SSL_MODE: verify-full
      RATE_LIMIT_BACKEND: postgres
      INTEGRATIONS_MODE: live
      JOB_QUEUE_MODE: database
      CSP_ENFORCE: "true"

    steps:
      - name: Fail closed on missing preview configuration
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          NEON_API_KEY_VALUE: ${{ secrets.NEON_PREVIEW_API_KEY }}
          VERCEL_BYPASS_VALUE: ${{ secrets.VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET }}
          NEON_PROJECT_ID_VALUE: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          NEON_PREVIEW_PARENT_VALUE: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          NEON_DATABASE_VALUE: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          NEON_ROLE_VALUE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          NEON_RUNTIME_ROLE_VALUE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          NEON_PLATFORM_ROLE_VALUE: ${{ vars.NEON_PREVIEW_PLATFORM_ROLE }}
          PREVIEW_APP_URL_TEMPLATE_VALUE: ${{ vars.VERCEL_PREVIEW_APP_URL_TEMPLATE }}
          PRODUCTION_VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          TENANT_CONTEXT_KEY_ID_VALUE: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          EXPECTED_TENANT_CONTEXT_KEY_ID: ${{ needs.tenant-context-key-contract.outputs.preview_key_id }}
          TENANT_CONTEXT_SECRET_VALUE: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_PREVIOUS_KEY_ID_VALUE: ${{ vars.TENANT_CONTEXT_PREVIOUS_KEY_ID }}
          TENANT_CONTEXT_PREVIOUS_SECRET_VALUE: ${{ secrets.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET }}
          TENANT_CONTEXT_RETIRE_PREVIOUS_KEY_VALUE: ${{ vars.TENANT_CONTEXT_RETIRE_PREVIOUS_KEY }}
          PRODUCTION_TENANT_CONTEXT_SECRET_SHA256: ${{ needs.tenant-context-key-contract.outputs.production_fingerprint }}
          PREVIEW_TENANT_CONTEXT_SECRET_SHA256: ${{ needs.tenant-context-key-contract.outputs.preview_fingerprint }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            VERCEL_TOKEN_VALUE NEON_API_KEY_VALUE \
            VERCEL_BYPASS_VALUE VERCEL_ORG_ID VERCEL_PROJECT_ID \
            NEON_PROJECT_ID_VALUE NEON_PREVIEW_PARENT_VALUE \
            NEON_DATABASE_VALUE NEON_ROLE_VALUE NEON_RUNTIME_ROLE_VALUE \
            NEON_PLATFORM_ROLE_VALUE \
            PREVIEW_APP_URL_TEMPLATE_VALUE PREVIEW_PR_NUMBER \
            PRODUCTION_VERCEL_ORG_ID PRODUCTION_VERCEL_PROJECT_ID \
            PRODUCTION_NEON_PROJECT_ID TENANT_CONTEXT_KEY_ID_VALUE \
            EXPECTED_TENANT_CONTEXT_KEY_ID \
            TENANT_CONTEXT_SECRET_VALUE \
            PRODUCTION_TENANT_CONTEXT_SECRET_SHA256 \
            PREVIEW_TENANT_CONTEXT_SECRET_SHA256; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required preview configuration: ${missing[*]}" >&2
            exit 1
          fi
          if [ "${#VERCEL_BYPASS_VALUE}" -lt 16 ]; then
            echo "VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET must be at least 16 characters." >&2
            exit 1
          fi
          if ! [[ "$TENANT_CONTEXT_KEY_ID_VALUE" =~ ^[a-z0-9][a-z0-9._-]{0,31}$ ]]; then
            echo "TENANT_CONTEXT_SIGNING_KEY_ID has an invalid rotation identifier." >&2
            exit 1
          fi
          if [ "$TENANT_CONTEXT_KEY_ID_VALUE" != "$EXPECTED_TENANT_CONTEXT_KEY_ID" ]; then
            echo "Preview TENANT_CONTEXT_SIGNING_KEY_ID does not match the reviewed key contract." >&2
            exit 1
          fi
          if ! [[ "$TENANT_CONTEXT_SECRET_VALUE" =~ ^[A-Za-z0-9_-]{43,128}$ ]]; then
            echo "TENANT_CONTEXT_SIGNING_SECRET must be a 43-128 character base64url secret." >&2
            exit 1
          fi
          if [ "$VERCEL_PROJECT_ID" = "$PRODUCTION_VERCEL_PROJECT_ID" ]; then
            echo "Preview Vercel must use a project separate from production." >&2
            exit 1
          fi
          if [ "$NEON_PROJECT_ID_VALUE" = "$PRODUCTION_NEON_PROJECT_ID" ]; then
            echo "Preview Neon must use a separate project with no production data or branches." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const identifiers = [
            'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID',
            'PRODUCTION_VERCEL_ORG_ID', 'PRODUCTION_VERCEL_PROJECT_ID',
            'NEON_PROJECT_ID_VALUE', 'NEON_PREVIEW_PARENT_VALUE'
          ];
          for (const name of identifiers) {
            if (!/^[A-Za-z0-9_-]+$/.test(process.env[name] || '')) {
              throw new Error(`${name} contains unsupported characters.`);
            }
          }
          for (const name of ['NEON_DATABASE_VALUE', 'NEON_ROLE_VALUE', 'NEON_RUNTIME_ROLE_VALUE', 'NEON_PLATFORM_ROLE_VALUE']) {
            if (!/^[a-z_][a-z0-9_]{0,62}$/.test(process.env[name] || '')) {
              throw new Error(`${name} must be a lowercase PostgreSQL identifier.`);
            }
          }
          if (process.env.NEON_ROLE_VALUE === process.env.NEON_RUNTIME_ROLE_VALUE) {
            throw new Error('Preview migration and tenant-runtime roles must be distinct.');
          }
          if (process.env.NEON_PLATFORM_ROLE_VALUE !== 'school_sis_platform') {
            throw new Error('NEON_PREVIEW_PLATFORM_ROLE must equal school_sis_platform.');
          }
          if (process.env.NEON_RUNTIME_ROLE_VALUE !== 'school_sis_runtime') {
            throw new Error('NEON_PREVIEW_RUNTIME_ROLE must equal school_sis_runtime.');
          }
          if (new Set([
            process.env.NEON_ROLE_VALUE,
            process.env.NEON_RUNTIME_ROLE_VALUE,
            process.env.NEON_PLATFORM_ROLE_VALUE
          ]).size !== 3) {
            throw new Error('Preview migration, tenant-runtime, and platform-runtime roles must be distinct.');
          }
          const productionFingerprint = process.env.PRODUCTION_TENANT_CONTEXT_SECRET_SHA256 || '';
          const previewFingerprint = process.env.PREVIEW_TENANT_CONTEXT_SECRET_SHA256 || '';
          if (
            !/^[0-9a-f]{64}$/.test(productionFingerprint) ||
            !/^[0-9a-f]{64}$/.test(previewFingerprint) ||
            productionFingerprint === previewFingerprint
          ) {
            throw new Error('Production and preview tenant-context secret fingerprints must be valid and distinct.');
          }
          const actualFingerprint = createHash('sha256')
            .update(process.env.TENANT_CONTEXT_SECRET_VALUE, 'utf8')
            .digest('hex');
          if (actualFingerprint !== previewFingerprint) {
            throw new Error('Preview tenant-context secret does not match its configured SHA-256 fingerprint.');
          }
          const previousKeyId = process.env.TENANT_CONTEXT_PREVIOUS_KEY_ID_VALUE || '';
          const previousSecret = process.env.TENANT_CONTEXT_PREVIOUS_SECRET_VALUE || '';
          const retirePrevious = process.env.TENANT_CONTEXT_RETIRE_PREVIOUS_KEY_VALUE || '';
          if (Boolean(previousKeyId) !== Boolean(previousSecret)) {
            throw new Error('TENANT_CONTEXT_PREVIOUS_KEY_ID and TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET must be configured together.');
          }
          if (previousKeyId && !/^[a-z0-9][a-z0-9._-]{0,31}$/.test(previousKeyId)) {
            throw new Error('TENANT_CONTEXT_PREVIOUS_KEY_ID has an invalid rotation identifier.');
          }
          if (previousSecret && !/^[A-Za-z0-9_-]{43,128}$/.test(previousSecret)) {
            throw new Error('TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET must be a 43-128 character base64url secret.');
          }
          if (previousKeyId === process.env.TENANT_CONTEXT_KEY_ID_VALUE && previousKeyId) {
            throw new Error('Current and previous tenant-context key IDs must differ.');
          }
          if (previousSecret === process.env.TENANT_CONTEXT_SECRET_VALUE && previousSecret) {
            throw new Error('Current and previous tenant-context secrets must differ.');
          }
          if (retirePrevious && retirePrevious !== 'true') {
            throw new Error('TENANT_CONTEXT_RETIRE_PREVIOUS_KEY must be unset or exactly true.');
          }
          if (retirePrevious === 'true' && previousKeyId) {
            throw new Error('TENANT_CONTEXT_RETIRE_PREVIOUS_KEY=true cannot be combined with a previous verification key.');
          }
          const template = process.env.PREVIEW_APP_URL_TEMPLATE_VALUE;
          if ((template.match(/\{pr\}/g) || []).length !== 1) {
            throw new Error('VERCEL_PREVIEW_APP_URL_TEMPLATE must contain exactly one {pr} placeholder.');
          }
          if (!/^[1-9][0-9]*$/.test(process.env.PREVIEW_PR_NUMBER || '')) {
            throw new Error('Preview pull-request number is invalid.');
          }
          const appUrl = new URL(template.replace('{pr}', process.env.PREVIEW_PR_NUMBER));
          if (
            appUrl.protocol !== 'https:' || appUrl.pathname !== '/' ||
            appUrl.search || appUrl.hash || appUrl.port ||
            appUrl.username || appUrl.password ||
            !/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(appUrl.hostname)
          ) {
            throw new Error('VERCEL_PREVIEW_APP_URL_TEMPLATE must produce a canonical HTTPS origin.');
          }
          const { appendFileSync } = await import('node:fs');
          appendFileSync(
            process.env.GITHUB_ENV,
            `NEXT_PUBLIC_APP_URL=${appUrl.origin}\nTENANT_BASE_HOSTS=${appUrl.hostname}\nPREVIEW_ALIAS_HOST=${appUrl.hostname}\n`,
          );
          NODE

      - name: Prove Vercel preview token project isolation
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          PRODUCTION_VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          preview_response="$RUNNER_TEMP/vercel-preview-project.json"
          production_response="$RUNNER_TEMP/vercel-production-project.json"
          trap 'rm -f "$preview_response" "$production_response"' EXIT

          preview_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $VERCEL_TOKEN_VALUE" \
            --header 'Accept: application/json' \
            --output "$preview_response" \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          if [ "$preview_http" != "200" ]; then
            echo "The preview token cannot access the configured preview Vercel project (HTTP $preview_http)." >&2
            exit 1
          fi
          if ! jq -e \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg team "$VERCEL_ORG_ID" \
            '.id == $project and .accountId == $team' \
            "$preview_response" >/dev/null; then
            echo "The preview token resolved a Vercel project outside the configured preview target." >&2
            exit 1
          fi

          production_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $VERCEL_TOKEN_VALUE" \
            --header 'Accept: application/json' \
            --output "$production_response" \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v9/projects/${PRODUCTION_VERCEL_PROJECT_ID}?teamId=${PRODUCTION_VERCEL_ORG_ID}")"
          case "$production_http" in
            403|404)
              ;;
            200)
              echo "The preview token can access the configured production Vercel project." >&2
              exit 1
              ;;
            *)
              echo "Could not prove that the preview token is isolated from production (HTTP $production_http)." >&2
              exit 1
              ;;
          esac

      - name: Prove Neon preview token project isolation
        env:
          NEON_PREVIEW_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          NEON_PREVIEW_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          PRODUCTION_NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          preview_response="$RUNNER_TEMP/neon-preview-project.json"
          production_response="$RUNNER_TEMP/neon-production-project-denied.json"
          trap 'rm -f "$preview_response" "$production_response"' EXIT
          preview_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $NEON_PREVIEW_API_KEY" \
            --header 'Accept: application/json' \
            --output "$preview_response" \
            --write-out '%{http_code}' \
            "https://console.neon.tech/api/v2/projects/${NEON_PREVIEW_PROJECT_ID}")"
          if [ "$preview_http" != "200" ]; then
            echo "The preview Neon token cannot access the exact preview project (HTTP $preview_http)." >&2
            exit 1
          fi
          jq -e --arg project "$NEON_PREVIEW_PROJECT_ID" \
            '.project.id == $project' "$preview_response" >/dev/null

          production_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $NEON_PREVIEW_API_KEY" \
            --header 'Accept: application/json' \
            --output "$production_response" \
            --write-out '%{http_code}' \
            "https://console.neon.tech/api/v2/projects/${PRODUCTION_NEON_PROJECT_ID}")"
          case "$production_http" in
            403|404) ;;
            200)
              echo "The preview Neon token can access the production Neon project." >&2
              exit 1
              ;;
            *)
              echo "Could not prove preview Neon token isolation from production (HTTP $production_http)." >&2
              exit 1
              ;;
          esac

      - name: Generate per-run preview application secrets
        run: |
          set -euo pipefail
          for name in SESSION_SECRET PII_ENCRYPTION_KEY JOB_DISPATCH_SECRET METRICS_TOKEN; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Checkout approved pull-request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned deployment tooling
        run: |
          set -euo pipefail
          configured_version="$(node -p "require('./package.json').devDependencies.vercel || ''")"
          if [ "$configured_version" != "59.0.0" ]; then
            echo "Root devDependency vercel must be pinned exactly to 59.0.0." >&2
            exit 1
          fi
          pnpm exec vercel --version | grep -Eq '(^|[^0-9])59\.0\.0([^0-9]|$)'

      - name: Set preview database expiry backstop
        id: expiry
        run: echo "expires_at=$(date -u -d '+1 day' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse schema-only Neon branch for migrations
        id: neon_migration
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          api_key: ${{ secrets.NEON_PREVIEW_API_KEY }}
          project_id: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          branch_name: ${{ env.PREVIEW_BRANCH_NAME }}
          branch_type: schema-only
          database: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          role: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          ssl: verify-full
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Refresh exact preview branch expiry
        env:
          NEON_API_KEY_VALUE: ${{ secrets.NEON_PREVIEW_API_KEY }}
          NEON_PROJECT_ID_VALUE: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          PREVIEW_BRANCH_ID: ${{ steps.neon_migration.outputs.branch_id }}
          EXPECTED_BRANCH_NAME: ${{ env.PREVIEW_BRANCH_NAME }}
          EXPECTED_EXPIRES_AT: ${{ steps.expiry.outputs.expires_at }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = [
            'NEON_API_KEY_VALUE', 'NEON_PROJECT_ID_VALUE', 'PREVIEW_BRANCH_ID',
            'EXPECTED_BRANCH_NAME', 'EXPECTED_EXPIRES_AT'
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing preview expiry value ${name}.`);
          }
          for (const name of ['NEON_PROJECT_ID_VALUE', 'PREVIEW_BRANCH_ID']) {
            if (!/^[a-z0-9-]{1,60}$/.test(process.env[name])) {
              throw new Error(`${name} is not a canonical Neon identifier.`);
            }
          }
          if (!/^preview\/pr-[1-9][0-9]*$/.test(process.env.EXPECTED_BRANCH_NAME)) {
            throw new Error('Preview branch name must be stable and PR-scoped.');
          }
          const expiresAt = new Date(process.env.EXPECTED_EXPIRES_AT);
          if (
            Number.isNaN(expiresAt.getTime()) ||
            expiresAt.toISOString().replace('.000Z', 'Z') !== process.env.EXPECTED_EXPIRES_AT
          ) {
            throw new Error('Preview branch expiry must be a canonical UTC timestamp.');
          }

          const endpoint = new URL(
            `https://console.neon.tech/api/v2/projects/${process.env.NEON_PROJECT_ID_VALUE}/branches/${process.env.PREVIEW_BRANCH_ID}`,
          );
          const headers = {
            Accept: 'application/json',
            Authorization: `Bearer ${process.env.NEON_API_KEY_VALUE}`,
            'Content-Type': 'application/json',
          };
          let payload;
          try {
            const response = await fetch(endpoint, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ branch: { expires_at: process.env.EXPECTED_EXPIRES_AT } }),
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            payload = await response.json();
          } catch {
            const verification = await fetch(endpoint, {
              headers,
              signal: AbortSignal.timeout(20_000),
            });
            if (!verification.ok) {
              throw new Error(`Could not prove preview branch expiry after PATCH (HTTP ${verification.status}).`);
            }
            payload = await verification.json();
          }
          const actualExpiresAt = new Date(payload?.branch?.expires_at);
          if (
            payload?.branch?.id !== process.env.PREVIEW_BRANCH_ID ||
            payload.branch.name !== process.env.EXPECTED_BRANCH_NAME ||
            payload.branch.parent_id !== null ||
            payload.branch.init_source !== 'schema-only' ||
            Number.isNaN(actualExpiresAt.getTime()) ||
            actualExpiresAt.getTime() !== expiresAt.getTime()
          ) {
            throw new Error('Preview branch expiry or schema-only identity did not match the exact requested state.');
          }
          NODE

      - name: Wait for exact preview roles to become resolvable
        env:
          NEON_API_KEY_VALUE: ${{ secrets.NEON_PREVIEW_API_KEY }}
          NEON_PROJECT_ID_VALUE: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          PREVIEW_BRANCH_ID: ${{ steps.neon_migration.outputs.branch_id }}
          NEON_DATABASE_VALUE: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          EXPECTED_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          EXPECTED_PLATFORM_ROLE: ${{ vars.NEON_PREVIEW_PLATFORM_ROLE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = [
            'NEON_API_KEY_VALUE', 'NEON_PROJECT_ID_VALUE', 'PREVIEW_BRANCH_ID',
            'NEON_DATABASE_VALUE', 'EXPECTED_RUNTIME_ROLE', 'EXPECTED_PLATFORM_ROLE'
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing preview role-readiness value ${name}.`);
          }
          for (const name of ['NEON_PROJECT_ID_VALUE', 'PREVIEW_BRANCH_ID']) {
            if (!/^[a-z0-9-]{1,60}$/.test(process.env[name])) {
              throw new Error(`${name} is not a canonical Neon identifier.`);
            }
          }
          if (
            !/^[a-z_][a-z0-9_]{0,62}$/.test(process.env.NEON_DATABASE_VALUE) ||
            process.env.EXPECTED_RUNTIME_ROLE !== 'school_sis_runtime' ||
            process.env.EXPECTED_PLATFORM_ROLE !== 'school_sis_platform'
          ) {
            throw new Error('Preview role readiness requires the exact database and application roles.');
          }

          const wait = (milliseconds) => new Promise((resolveWait) =>
            setTimeout(resolveWait, milliseconds)
          );
          const roles = [
            process.env.EXPECTED_RUNTIME_ROLE,
            process.env.EXPECTED_PLATFORM_ROLE,
          ];
          const statusForRole = async (role) => {
            const endpoint = new URL(
              `https://console.neon.tech/api/v2/projects/${process.env.NEON_PROJECT_ID_VALUE}/connection_uri`,
            );
            endpoint.searchParams.set('branch_id', process.env.PREVIEW_BRANCH_ID);
            endpoint.searchParams.set('database_name', process.env.NEON_DATABASE_VALUE);
            endpoint.searchParams.set('role_name', role);
            endpoint.searchParams.set('pooled', 'true');
            let response;
            try {
              response = await fetch(endpoint, {
                headers: {
                  Accept: 'application/json',
                  Authorization: `Bearer ${process.env.NEON_API_KEY_VALUE}`,
                },
                signal: AbortSignal.timeout(10_000),
              });
            } catch (error) {
              return `network-${error instanceof Error ? error.name : 'failure'}`;
            }
            if (response.status === 401 || response.status === 403) {
              throw new Error(`Neon rejected preview role-readiness authorization with HTTP ${response.status}.`);
            }
            if (!response.ok) return `http-${response.status}`;
            try {
              const payload = await response.json();
              const pooled = new URL(payload.uri || '');
              if (
                pooled.hostname.endsWith('.neon.tech') &&
                pooled.hostname.includes('-pooler') &&
                decodeURIComponent(pooled.username) === role &&
                decodeURIComponent(pooled.pathname.slice(1)) === process.env.NEON_DATABASE_VALUE &&
                decodeURIComponent(pooled.password).length > 0
              ) {
                return 'ready';
              }
            } catch {
              return 'invalid-metadata';
            }
            return 'mismatched-metadata';
          };

          const readinessDeadline = Date.now() + (5 * 60 * 1_000);
          let lastStatuses = [];
          for (;;) {
            lastStatuses = await Promise.all(
              roles.map(async (role) => [role, await statusForRole(role)]),
            );
            if (lastStatuses.every(([, status]) => status === 'ready')) break;
            if (Date.now() >= readinessDeadline) {
              const summary = lastStatuses.map(([role, status]) => `${role}=${status}`).join(', ');
              throw new Error(`Neon preview roles did not become resolvable: ${summary}.`);
            }
            await wait(Math.min(3_000, Math.max(0, readinessDeadline - Date.now())));
          }
          NODE

      - name: Resolve pooled Neon URL for the runtime role
        id: neon_runtime
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          api_key: ${{ secrets.NEON_PREVIEW_API_KEY }}
          project_id: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          branch_name: ${{ env.PREVIEW_BRANCH_NAME }}
          branch_type: schema-only
          database: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          role: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          ssl: verify-full
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Resolve pooled Neon URL for the platform role
        id: neon_platform
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          api_key: ${{ secrets.NEON_PREVIEW_API_KEY }}
          project_id: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PREVIEW_TEMPLATE_BRANCH_ID }}
          branch_name: ${{ env.PREVIEW_BRANCH_NAME }}
          branch_type: schema-only
          database: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          role: ${{ vars.NEON_PREVIEW_PLATFORM_ROLE }}
          ssl: verify-full
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Rotate and verify isolated preview application credentials
        id: neon_application_credentials
        env:
          PREVIEW_DIRECT_URL: ${{ steps.neon_migration.outputs.db_url }}
          PREVIEW_RUNTIME_POOLED_URL: ${{ steps.neon_runtime.outputs.db_url_pooled }}
          PREVIEW_PLATFORM_POOLED_URL: ${{ steps.neon_platform.outputs.db_url_pooled }}
          PREVIEW_MIGRATION_BRANCH_ID: ${{ steps.neon_migration.outputs.branch_id }}
          PREVIEW_RUNTIME_BRANCH_ID: ${{ steps.neon_runtime.outputs.branch_id }}
          PREVIEW_PLATFORM_BRANCH_ID: ${{ steps.neon_platform.outputs.branch_id }}
          EXPECTED_DATABASE: ${{ vars.NEON_PREVIEW_DATABASE_NAME }}
          EXPECTED_MIGRATION_ROLE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          EXPECTED_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          EXPECTED_PLATFORM_ROLE: ${{ vars.NEON_PREVIEW_PLATFORM_ROLE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';

          const require = createRequire(resolve('apps/web/package.json'));
          const { Client } = require('pg');
          const required = [
            'PREVIEW_DIRECT_URL', 'PREVIEW_RUNTIME_POOLED_URL',
            'PREVIEW_PLATFORM_POOLED_URL', 'PREVIEW_MIGRATION_BRANCH_ID',
            'PREVIEW_RUNTIME_BRANCH_ID', 'PREVIEW_PLATFORM_BRANCH_ID',
            'EXPECTED_DATABASE', 'EXPECTED_MIGRATION_ROLE',
            'EXPECTED_RUNTIME_ROLE', 'EXPECTED_PLATFORM_ROLE'
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing preview credential value ${name}.`);
          }
          if (
            process.env.EXPECTED_RUNTIME_ROLE !== 'school_sis_runtime' ||
            process.env.EXPECTED_PLATFORM_ROLE !== 'school_sis_platform' ||
            new Set([
              process.env.EXPECTED_MIGRATION_ROLE,
              process.env.EXPECTED_RUNTIME_ROLE,
              process.env.EXPECTED_PLATFORM_ROLE,
            ]).size !== 3
          ) {
            throw new Error('Preview credential rotation requires three exact, distinct roles.');
          }
          if (
            process.env.PREVIEW_MIGRATION_BRANCH_ID !== process.env.PREVIEW_RUNTIME_BRANCH_ID ||
            process.env.PREVIEW_MIGRATION_BRANCH_ID !== process.env.PREVIEW_PLATFORM_BRANCH_ID
          ) {
            throw new Error('Preview credential rotation requires one exact Neon branch.');
          }

          const forbiddenQueryParameters = new Set([
            'database', 'db', 'host', 'hostaddr', 'options', 'password', 'port', 'user'
          ]);
          const parseDatabaseUrl = (value, label) => {
            const url = new URL(value || '');
            if (url.protocol !== 'postgresql:' && url.protocol !== 'postgres:') {
              throw new Error(`${label} must be a PostgreSQL URL.`);
            }
            const overrides = [...url.searchParams.keys()].filter((key) =>
              forbiddenQueryParameters.has(key.toLowerCase())
            );
            if (overrides.length > 0) {
              throw new Error(`${label} contains a forbidden connection-identity query override.`);
            }
            const channelBindingKeys = [...url.searchParams.keys()].filter(
              (key) => key.toLowerCase() === 'channel_binding',
            );
            if (
              channelBindingKeys.length > 1 ||
              channelBindingKeys.some((key) => url.searchParams.get(key) !== 'require')
            ) {
              throw new Error(`${label} has an invalid channel-binding override.`);
            }
            for (const key of channelBindingKeys) url.searchParams.delete(key);
            url.searchParams.append('channel_binding', 'require');
            if (url.searchParams.get('sslmode') !== 'verify-full') {
              throw new Error(`${label} must require full TLS verification.`);
            }
            return url;
          };

          const direct = parseDatabaseUrl(process.env.PREVIEW_DIRECT_URL, 'PREVIEW_DIRECT_URL');
          const runtimePooled = parseDatabaseUrl(
            process.env.PREVIEW_RUNTIME_POOLED_URL,
            'PREVIEW_RUNTIME_POOLED_URL',
          );
          const platformPooled = parseDatabaseUrl(
            process.env.PREVIEW_PLATFORM_POOLED_URL,
            'PREVIEW_PLATFORM_POOLED_URL',
          );
          if (
            !direct.hostname.endsWith('.neon.tech') || direct.hostname.includes('-pooler') ||
            decodeURIComponent(direct.username) !== process.env.EXPECTED_MIGRATION_ROLE ||
            decodeURIComponent(direct.pathname.slice(1)) !== process.env.EXPECTED_DATABASE ||
            !decodeURIComponent(direct.password)
          ) {
            throw new Error('Preview credential rotation requires the exact direct migration-owner URL.');
          }
          if (
            !runtimePooled.hostname.endsWith('.neon.tech') ||
            !runtimePooled.hostname.includes('-pooler') ||
            decodeURIComponent(runtimePooled.username) !== process.env.EXPECTED_RUNTIME_ROLE ||
            !decodeURIComponent(runtimePooled.password)
          ) {
            throw new Error('Preview credential rotation requires the exact pooled tenant-runtime URL.');
          }
          if (
            !platformPooled.hostname.endsWith('.neon.tech') ||
            !platformPooled.hostname.includes('-pooler') ||
            decodeURIComponent(platformPooled.username) !== process.env.EXPECTED_PLATFORM_ROLE ||
            !decodeURIComponent(platformPooled.password)
          ) {
            throw new Error('Preview credential rotation requires the exact pooled platform-runtime URL.');
          }
          if (
            runtimePooled.hostname !== platformPooled.hostname ||
            runtimePooled.hostname.replace('-pooler.', '.') !== direct.hostname ||
            decodeURIComponent(runtimePooled.pathname) !== decodeURIComponent(direct.pathname) ||
            decodeURIComponent(platformPooled.pathname) !== decodeURIComponent(direct.pathname)
          ) {
            throw new Error('Preview database URLs must identify one exact endpoint and database.');
          }

          const migrationPassword = decodeURIComponent(direct.password);
          const distinctPassword = (excluded) => {
            let candidate;
            do candidate = randomBytes(48).toString('base64url');
            while (excluded.has(candidate));
            return candidate;
          };
          const runtimePassword = distinctPassword(new Set([migrationPassword]));
          const platformPassword = distinctPassword(
            new Set([migrationPassword, runtimePassword]),
          );
          process.stdout.write(`::add-mask::${runtimePassword}\n::add-mask::${platformPassword}\n`);

          const owner = new Client({
            connectionString: direct.toString(),
            application_name: 'school-sis-preview-credential-rotation',
            enableChannelBinding: true,
          });
          await owner.connect();
          try {
            const identity = await owner.query(
              'SELECT current_user AS current_user, current_database() AS current_database',
            );
            if (
              identity.rows[0]?.current_user !== process.env.EXPECTED_MIGRATION_ROLE ||
              identity.rows[0]?.current_database !== process.env.EXPECTED_DATABASE
            ) {
              throw new Error('Preview credential rotation connected with the wrong owner identity.');
            }
            const roles = await owner.query(
              `SELECT rolname, rolcanlogin, rolsuper, rolcreaterole, rolcreatedb,
                      rolreplication, rolbypassrls
               FROM pg_roles
               WHERE rolname::text = ANY($1::text[])
               ORDER BY rolname`,
              [[process.env.EXPECTED_RUNTIME_ROLE, process.env.EXPECTED_PLATFORM_ROLE]],
            );
            const byName = new Map(roles.rows.map((role) => [role.rolname, role]));
            for (const roleName of [
              process.env.EXPECTED_RUNTIME_ROLE,
              process.env.EXPECTED_PLATFORM_ROLE,
            ]) {
              const role = byName.get(roleName);
              if (
                !role || role.rolcanlogin !== true || role.rolsuper !== false ||
                role.rolcreaterole !== false || role.rolcreatedb !== false ||
                role.rolreplication !== false || role.rolbypassrls !== false
              ) {
                throw new Error(`Preview application role ${roleName} is missing or has unsafe global attributes.`);
              }
            }

            await owner.query('BEGIN');
            try {
              await owner.query(
                "SELECT set_config('app.preview_runtime_role', $1, true), set_config('app.preview_runtime_password', $2, true), set_config('app.preview_platform_role', $3, true), set_config('app.preview_platform_password', $4, true)",
                [
                  process.env.EXPECTED_RUNTIME_ROLE,
                  runtimePassword,
                  process.env.EXPECTED_PLATFORM_ROLE,
                  platformPassword,
                ],
              );
              await owner.query(`
                DO $rotate_preview_application_passwords$
                DECLARE
                  runtime_role text := current_setting('app.preview_runtime_role');
                  runtime_password text := current_setting('app.preview_runtime_password');
                  platform_role text := current_setting('app.preview_platform_role');
                  platform_password text := current_setting('app.preview_platform_password');
                BEGIN
                  IF runtime_role <> 'school_sis_runtime' OR
                     platform_role <> 'school_sis_platform' OR
                     runtime_password = '' OR platform_password = '' OR
                     runtime_password = platform_password THEN
                    RAISE EXCEPTION 'Invalid preview application credential rotation target';
                  END IF;
                  EXECUTE format('ALTER ROLE %I PASSWORD %L', runtime_role, runtime_password);
                  EXECUTE format('ALTER ROLE %I PASSWORD %L', platform_role, platform_password);
                END
                $rotate_preview_application_passwords$
              `);
              await owner.query('COMMIT');
            } catch (error) {
              await owner.query('ROLLBACK');
              throw error;
            }
          } finally {
            await owner.end();
          }

          runtimePooled.password = runtimePassword;
          platformPooled.password = platformPassword;
          const migrationDirectUrl = direct.toString();
          const rotatedRuntimeUrl = runtimePooled.toString();
          const rotatedPlatformUrl = platformPooled.toString();
          const finalPasswords = [migrationDirectUrl, rotatedRuntimeUrl, rotatedPlatformUrl].map(
            (value) => decodeURIComponent(new URL(value).password),
          );
          if (
            finalPasswords.some((password) => password.length === 0) ||
            new Set(finalPasswords).size !== 3
          ) {
            throw new Error('Rotated preview database passwords are not pairwise distinct.');
          }
          process.stdout.write(
            `::add-mask::${migrationDirectUrl}\n::add-mask::${rotatedRuntimeUrl}\n::add-mask::${rotatedPlatformUrl}\n`,
          );

          const verifyRole = async (connectionString, expectedRole) => {
            const verifier = new Client({ connectionString, enableChannelBinding: true });
            await verifier.connect();
            try {
              const identity = await verifier.query(
                'SELECT current_user AS current_user, current_database() AS current_database',
              );
              if (
                identity.rows[0]?.current_user !== expectedRole ||
                identity.rows[0]?.current_database !== process.env.EXPECTED_DATABASE
              ) {
                throw new Error(`Rotated preview credentials resolved to the wrong ${expectedRole} identity.`);
              }
            } finally {
              await verifier.end();
            }
          };
          await verifyRole(rotatedRuntimeUrl, process.env.EXPECTED_RUNTIME_ROLE);
          await verifyRole(rotatedPlatformUrl, process.env.EXPECTED_PLATFORM_ROLE);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `migration_direct_url=${migrationDirectUrl}\n` +
              `runtime_pooled_url=${rotatedRuntimeUrl}\n` +
              `platform_pooled_url=${rotatedPlatformUrl}\n`,
          );
          NODE

      - name: Validate Neon action outputs
        env:
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          EXPECTED_BRANCH_NAME: ${{ env.PREVIEW_BRANCH_NAME }}
          EXPECTED_EXPIRES_AT: ${{ steps.expiry.outputs.expires_at }}
          PREVIEW_DIRECT_URL: ${{ steps.neon_application_credentials.outputs.migration_direct_url }}
          PREVIEW_POOLED_URL: ${{ steps.neon_application_credentials.outputs.runtime_pooled_url }}
          PREVIEW_PLATFORM_POOLED_URL: ${{ steps.neon_application_credentials.outputs.platform_pooled_url }}
          PREVIEW_MIGRATION_BRANCH_ID: ${{ steps.neon_migration.outputs.branch_id }}
          PREVIEW_RUNTIME_BRANCH_ID: ${{ steps.neon_runtime.outputs.branch_id }}
          PREVIEW_PLATFORM_BRANCH_ID: ${{ steps.neon_platform.outputs.branch_id }}
          EXPECTED_MIGRATION_ROLE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          EXPECTED_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          EXPECTED_PLATFORM_ROLE: ${{ vars.NEON_PREVIEW_PLATFORM_ROLE }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = [
            'PREVIEW_DIRECT_URL', 'PREVIEW_POOLED_URL', 'PREVIEW_PLATFORM_POOLED_URL',
            'PREVIEW_MIGRATION_BRANCH_ID', 'PREVIEW_RUNTIME_BRANCH_ID',
            'PREVIEW_PLATFORM_BRANCH_ID', 'EXPECTED_MIGRATION_ROLE',
            'EXPECTED_RUNTIME_ROLE', 'EXPECTED_PLATFORM_ROLE'
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Neon action did not return ${name}.`);
          }
          process.stderr.write('Neon output validation: required outputs are present.\n');
          const parseUrl = (value, label) => {
            try {
              return new URL(value);
            } catch {
              throw new Error(`Neon output validation: ${label} is not a valid URL.`);
            }
          };
          const direct = parseUrl(process.env.PREVIEW_DIRECT_URL, 'migration URL');
          const pooled = parseUrl(process.env.PREVIEW_POOLED_URL, 'tenant-runtime URL');
          const platformPooled = parseUrl(
            process.env.PREVIEW_PLATFORM_POOLED_URL,
            'platform-runtime URL',
          );
          if (
            process.env.PREVIEW_MIGRATION_BRANCH_ID !== process.env.PREVIEW_RUNTIME_BRANCH_ID ||
            process.env.PREVIEW_MIGRATION_BRANCH_ID !== process.env.PREVIEW_PLATFORM_BRANCH_ID
          ) {
            throw new Error('Neon migration, tenant-runtime, and platform-runtime URLs do not belong to the same branch.');
          }
          if (!direct.hostname.endsWith('.neon.tech') || direct.hostname.includes('-pooler')) {
            throw new Error('Neon direct URL output is not a direct Neon endpoint.');
          }
          if (!pooled.hostname.endsWith('.neon.tech') || !pooled.hostname.includes('-pooler')) {
            throw new Error('Neon pooled URL output is not a pooled Neon endpoint.');
          }
          if (
            !platformPooled.hostname.endsWith('.neon.tech') ||
            !platformPooled.hostname.includes('-pooler') ||
            platformPooled.hostname !== pooled.hostname ||
            decodeURIComponent(platformPooled.pathname) !== decodeURIComponent(pooled.pathname)
          ) {
            throw new Error('Neon platform URL is not the same branch/database pooled endpoint.');
          }
          process.stderr.write('Neon output validation: branch and endpoint topology match.\n');
          if (decodeURIComponent(direct.username) !== process.env.EXPECTED_MIGRATION_ROLE) {
            throw new Error('Neon direct URL does not use the configured migration role.');
          }
          if (decodeURIComponent(pooled.username) !== process.env.EXPECTED_RUNTIME_ROLE) {
            throw new Error('Neon pooled URL does not use the configured runtime role.');
          }
          if (decodeURIComponent(platformPooled.username) !== process.env.EXPECTED_PLATFORM_ROLE) {
            throw new Error('Neon platform pooled URL does not use the configured platform role.');
          }
          process.stderr.write('Neon output validation: all role identities match.\n');
          for (const [label, url] of [
            ['migration', direct],
            ['tenant-runtime', pooled],
            ['platform-runtime', platformPooled],
          ]) {
            const channelBinding = [...url.searchParams.entries()].filter(
              ([key]) => key.toLowerCase() === 'channel_binding',
            );
            if (
              url.searchParams.get('sslmode') !== 'verify-full' ||
              channelBinding.length !== 1 || channelBinding[0][1] !== 'require'
            ) {
              throw new Error(`Neon ${label} URL does not require full TLS and channel binding.`);
            }
          }
          process.stderr.write('Neon output validation: TLS and channel binding are required.\n');
          const passwords = [direct, pooled, platformPooled].map((url) =>
            decodeURIComponent(url.password)
          );
          if (passwords.some((password) => password.length === 0) || new Set(passwords).size !== 3) {
            throw new Error('Preview migration, tenant-runtime, and platform-runtime database passwords must be nonempty and pairwise distinct.');
          }
          process.stderr.write('Neon output validation: database credentials are pairwise distinct.\n');
          NODE

          branch_file="$RUNNER_TEMP/neon-preview-branch.json"
          trap 'rm -f "$branch_file"' EXIT
          branch_http="$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 20 \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header 'Accept: application/json' \
            --output "$branch_file" \
            --write-out '%{http_code}' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${PREVIEW_MIGRATION_BRANCH_ID}")"
          if [ "$branch_http" != "200" ]; then
            echo "Could not verify the isolated Neon preview branch." >&2
            exit 1
          fi
          if ! jq -e \
              --arg id "$PREVIEW_MIGRATION_BRANCH_ID" \
              --arg name "$EXPECTED_BRANCH_NAME" \
              --arg expires "$EXPECTED_EXPIRES_AT" \
              '.branch.id == $id and .branch.parent_id == null and .branch.init_source == "schema-only" and .branch.name == $name and (.branch.expires_at | type == "string") and ((.branch.expires_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) == ($expires | fromdateiso8601))' \
              "$branch_file" >/dev/null; then
            echo "Neon branch metadata validation failed for the expected id, root schema-only source, name, or expiry." >&2
            exit 1
          fi
          echo "Neon output validation: branch metadata matches." >&2
          tenant_context_audience="preview:${NEON_PROJECT_ID}:${PREVIEW_MIGRATION_BRANCH_ID}"
          if ! [[ "$tenant_context_audience" =~ ^[a-z0-9][a-z0-9:._-]{2,191}$ ]]; then
            echo "Derived preview tenant-context audience is invalid." >&2
            exit 1
          fi
          echo "TENANT_CONTEXT_AUDIENCE=$tenant_context_audience" >> "$GITHUB_ENV"

      - name: Pull Vercel preview settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          DATABASE_URL: ${{ steps.neon_application_credentials.outputs.runtime_pooled_url }}
          PLATFORM_DATABASE_URL: ${{ steps.neon_application_credentials.outputs.platform_pooled_url }}
          DIRECT_URL: ${{ steps.neon_application_credentials.outputs.migration_direct_url }}
          DEPLOYMENT_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          DEPLOYMENT_PLATFORM_ROLE: ${{ vars.NEON_PREVIEW_PLATFORM_ROLE }}
          DEPLOYMENT_MIGRATION_ROLE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          EXPECTED_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET }}
          GIT_COMMIT_SHA: ${{ env.TARGET_SHA }}
          TENANT_CONTEXT_SIGNING_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          TENANT_CONTEXT_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          EXPECTED_TENANT_CONTEXT_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          EXPECTED_TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          EXPECTED_VERCEL_REGION: iad1
          TENANT_CONTEXT_PREVIOUS_KEY_ID: ${{ vars.TENANT_CONTEXT_PREVIOUS_KEY_ID }}
          TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET }}
          TENANT_CONTEXT_RETIRE_PREVIOUS_KEY: ${{ vars.TENANT_CONTEXT_RETIRE_PREVIOUS_KEY }}
        run: |
          set -euo pipefail
          pnpm exec vercel pull \
            --yes \
            --environment=preview \
            --git-branch="$PR_HEAD_REF" \
            --token="$VERCEL_TOKEN"

          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import {
            existsSync, readFileSync, readdirSync, rmSync, writeFileSync
          } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';

          const linkCandidates = [
            '.vercel/project.json',
            'apps/web/.vercel/project.json'
          ].filter(existsSync);
          if (linkCandidates.length !== 1) {
            throw new Error(`Expected exactly one Vercel project link, found ${linkCandidates.length}.`);
          }
          const link = JSON.parse(readFileSync(linkCandidates[0], 'utf8'));
          if (
            link.orgId !== process.env.VERCEL_ORG_ID ||
            link.projectId !== process.env.VERCEL_PROJECT_ID
          ) {
            throw new Error('Pulled Vercel settings do not belong to the configured preview project.');
          }

          const environmentPath = join(dirname(linkCandidates[0]), '.env.preview.local');
          if (!existsSync(environmentPath)) {
            throw new Error('Vercel did not create the preview environment cache.');
          }
          const require = createRequire(resolve('apps/web/package.json'));
          const { parse } = require('dotenv');
          const pulled = parse(readFileSync(environmentPath));
          const allowedPulledNames = new Set([
            'CI', 'ENABLE_EXPERIMENTAL_COREPACK', 'VERCEL', 'VERCEL_BRANCH_URL',
            'VERCEL_AUTOMATION_BYPASS_SECRET',
            'VERCEL_DEPLOYMENT_ID', 'VERCEL_ENV', 'VERCEL_OIDC_TOKEN',
            'VERCEL_PROJECT_ID', 'VERCEL_PROJECT_NAME',
            'VERCEL_PROJECT_PRODUCTION_URL', 'VERCEL_REGION',
            'VERCEL_SKEW_PROTECTION_ENABLED', 'VERCEL_TARGET_ENV', 'VERCEL_URL'
          ]);
          const unexpected = Object.keys(pulled).filter(
            (name) =>
              !allowedPulledNames.has(name) &&
              !/^VERCEL_GIT_[A-Z0-9_]+$/.test(name),
          );
          if (unexpected.length > 0) {
            throw new Error(
              `Preview Vercel project contains persistent application variables; remove them before deploying: ${unexpected.sort().join(', ')}`,
            );
          }
          if (
            pulled.ENABLE_EXPERIMENTAL_COREPACK !== undefined &&
            pulled.ENABLE_EXPERIMENTAL_COREPACK !== '1'
          ) {
            throw new Error('Preview ENABLE_EXPERIMENTAL_COREPACK must equal 1 when configured.');
          }
          if (
            pulled.VERCEL_AUTOMATION_BYPASS_SECRET !== undefined &&
            pulled.VERCEL_AUTOMATION_BYPASS_SECRET !== process.env.EXPECTED_VERCEL_BYPASS_SECRET
          ) {
            throw new Error('Preview Vercel automation bypass does not match the protected GitHub Environment secret.');
          }

          for (const directory of ['.vercel', 'apps/web/.vercel']) {
            if (!existsSync(directory)) continue;
            for (const entry of readdirSync(directory)) {
              if (/^\.env(?:\..+)?\.local$/.test(entry)) rmSync(join(directory, entry));
            }
          }

          const environmentNames = [
            'DATABASE_URL', 'PLATFORM_DATABASE_URL', 'DIRECT_URL',
            'DEPLOYMENT_RUNTIME_ROLE', 'DEPLOYMENT_PLATFORM_ROLE',
            'DEPLOYMENT_MIGRATION_ROLE', 'DATABASE_SSL_MODE', 'SESSION_SECRET',
            'PII_ENCRYPTION_KEY', 'JOB_DISPATCH_SECRET', 'METRICS_TOKEN',
            'NEXT_PUBLIC_APP_URL', 'TENANT_BASE_HOSTS', 'RATE_LIMIT_BACKEND',
            'INTEGRATIONS_MODE', 'JOB_QUEUE_MODE', 'CSP_ENFORCE', 'GIT_COMMIT_SHA',
            'TENANT_CONTEXT_AUDIENCE', 'TENANT_CONTEXT_SIGNING_KEY_ID',
            'TENANT_CONTEXT_SIGNING_SECRET'
          ];
          for (const optionalName of [
            'TENANT_CONTEXT_PREVIOUS_KEY_ID',
            'TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET',
            'TENANT_CONTEXT_RETIRE_PREVIOUS_KEY'
          ]) {
            if (process.env[optionalName]) environmentNames.push(optionalName);
          }
          const lines = environmentNames.map((name) => {
            const value = process.env[name];
            if (!value) throw new Error(`Missing isolated preview value ${name}.`);
            return `${name}=${JSON.stringify(value)}`;
          });
          writeFileSync(environmentPath, `${lines.join('\n')}\n`, { mode: 0o600 });
          NODE

      - name: Build, then migrate the isolated preview database
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          VERCEL_TARGET_ENV: preview
          DATABASE_URL: ${{ steps.neon_application_credentials.outputs.runtime_pooled_url }}
          PLATFORM_DATABASE_URL: ${{ steps.neon_application_credentials.outputs.platform_pooled_url }}
          DIRECT_URL: ${{ steps.neon_application_credentials.outputs.migration_direct_url }}
          DEPLOYMENT_RUNTIME_ROLE: ${{ vars.NEON_PREVIEW_RUNTIME_ROLE }}
          DEPLOYMENT_PLATFORM_ROLE: ${{ vars.NEON_PREVIEW_PLATFORM_ROLE }}
          DEPLOYMENT_MIGRATION_ROLE: ${{ vars.NEON_PREVIEW_MIGRATION_ROLE }}
          GIT_COMMIT_SHA: ${{ env.TARGET_SHA }}
          TENANT_CONTEXT_SIGNING_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          TENANT_CONTEXT_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          TENANT_CONTEXT_PREVIOUS_KEY_ID: ${{ vars.TENANT_CONTEXT_PREVIOUS_KEY_ID }}
          TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET }}
          TENANT_CONTEXT_RETIRE_PREVIOUS_KEY: ${{ vars.TENANT_CONTEXT_RETIRE_PREVIOUS_KEY }}
        run: |
          set -euo pipefail
          pnpm exec vercel build --target=preview --yes --token="$VERCEL_TOKEN"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          const outputCandidates = [
            '.vercel/output',
            'apps/web/.vercel/output'
          ].filter(existsSync);
          if (outputCandidates.length !== 1) {
            throw new Error(`Expected exactly one Vercel build output, found ${outputCandidates.length}.`);
          }
          const databaseVariables = [
            'DATABASE_URL',
            'PLATFORM_DATABASE_URL',
            'DIRECT_URL'
          ];
          const needles = databaseVariables.flatMap((name) => {
            const value = process.env[name];
            if (!value) throw new Error(`Missing ${name} during credential scan.`);
            return [value, decodeURIComponent(new URL(value).password)];
          });
          needles.push(
            process.env.TENANT_CONTEXT_SIGNING_SECRET,
            process.env.TENANT_CONTEXT_PREVIOUS_SIGNING_SECRET,
          );
          const protectedNeedles = needles.filter(
            (value) => typeof value === 'string' && value.length >= 12,
          );
          const pending = [outputCandidates[0]];
          while (pending.length > 0) {
            const current = pending.pop();
            for (const entry of readdirSync(current)) {
              const path = join(current, entry);
              const stats = statSync(path);
              if (stats.isDirectory()) pending.push(path);
              if (!stats.isFile()) continue;
              const contents = readFileSync(path);
              if (protectedNeedles.some((needle) => contents.includes(Buffer.from(needle)))) {
                throw new Error('The preview build output contains a protected credential.');
              }
            }
          }
          NODE
          pnpm db:migrate:deploy -- --target preview

      - name: Deploy prebuilt preview with pooled application connections only
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          DATABASE_URL: ${{ steps.neon_application_credentials.outputs.runtime_pooled_url }}
          PLATFORM_DATABASE_URL: ${{ steps.neon_application_credentials.outputs.platform_pooled_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_PREVIEW_AUTOMATION_BYPASS_SECRET }}
          TENANT_CONTEXT_SIGNING_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          TENANT_CONTEXT_SIGNING_SECRET: ${{ secrets.TENANT_CONTEXT_SIGNING_SECRET }}
          TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          EXPECTED_TENANT_CONTEXT_KEY_ID: ${{ vars.TENANT_CONTEXT_SIGNING_KEY_ID }}
          EXPECTED_TENANT_CONTEXT_AUDIENCE: ${{ env.TENANT_CONTEXT_AUDIENCE }}
          EXPECTED_VERCEL_REGION: iad1
        run: |
          set -euo pipefail
          deployment_json="$RUNNER_TEMP/vercel-preview-deployment.json"
          pnpm exec vercel deploy \
            --prebuilt \
            --target=preview \
            --regions iad1 \
            --yes \
            --json \
            --token="$VERCEL_TOKEN" \
            --meta "githubDeployment=1" \
            --meta "githubCommitRef=$PR_HEAD_REF" \
            --meta "gitCommitSha=$TARGET_SHA" \
            --meta "githubCommitSha=$TARGET_SHA" \
            --meta "githubCommitOrg=${{ github.repository_owner }}" \
            --meta "githubCommitRepo=${{ github.event.repository.name }}" \
            --meta "githubPrId=${{ github.event.pull_request.number }}" \
            --meta "schoolSisPreview=1" \
            --env DATABASE_URL \
            --env PLATFORM_DATABASE_URL \
            --env "DATABASE_SSL_MODE=verify-full" \
            --env "RATE_LIMIT_BACKEND=postgres" \
            --env SESSION_SECRET \
            --env PII_ENCRYPTION_KEY \
            --env JOB_DISPATCH_SECRET \
            --env METRICS_TOKEN \
            --env TENANT_CONTEXT_AUDIENCE \
            --env TENANT_CONTEXT_SIGNING_KEY_ID \
            --env TENANT_CONTEXT_SIGNING_SECRET \
            --env NEXT_PUBLIC_APP_URL \
            --env TENANT_BASE_HOSTS \
            --env "INTEGRATIONS_MODE=live" \
            --env "JOB_QUEUE_MODE=database" \
            --env "CSP_ENFORCE=true" \
            --env "GIT_COMMIT_SHA=$TARGET_SHA" \
            >"$deployment_json"
          deployment_url="$(jq -er '(.deployment // .).url | select(type == "string" and length > 0)' "$deployment_json")"
          deployment_id="$(jq -er '(.deployment // .).id | select(type == "string" and length > 0)' "$deployment_json")"
          case "$deployment_url" in
            https://*) ;;
            *) deployment_url="https://$deployment_url" ;;
          esac
          pnpm exec vercel alias set \
            "$deployment_id" \
            "$PREVIEW_ALIAS_HOST" \
            --token="$VERCEL_TOKEN"
          deployment_url="$NEXT_PUBLIC_APP_URL"
          unset VERCEL_TOKEN
          node scripts/verify-deployment.mjs \
            --base-url "$deployment_url" \
            --sha "$TARGET_SHA" \
            --attempts 18 \
            --require-bypass true
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Create or update pull-request preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
          PREVIEW_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          marker='<!-- school-sis-vercel-preview -->'
          body="${marker}
          <!-- school-sis-vercel-deployment:${PREVIEW_DEPLOYMENT_ID} -->
          Preview is ready: ${PREVIEW_URL}

          Commit: \`${TARGET_SHA}\`
          Database: isolated schema-only Neon branch \`${PREVIEW_BRANCH_NAME}\`"
          comment_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            --jq 'map(select(.body | contains("<!-- school-sis-vercel-preview -->")))[0].id // empty')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="$body" >/dev/null
          fi
