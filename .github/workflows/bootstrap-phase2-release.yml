name: Bootstrap Phase 2 Release PR

on:
  push:
    branches: ["feat/pii-users-email-DONOTMERGE"]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create guarded release PR and wait for cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Release Phase 2 quality and scale hardening" \
              --body "Ships the validated Phase 1 security closure and Phase 2 quality, toolchain, Next.js 16, E2E, and durable lead-intake work. The protected production workflow owns Neon migration and Vercel promotion."
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number')"
          fi

          for _ in $(seq 1 60); do
            head_sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            if [ "$head_sha" != "$GITHUB_SHA" ]; then
              break
            fi
            sleep 10
          done
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "Timed out waiting for the workflow cleanup commit." >&2
            exit 1
          fi

          for _ in $(seq 1 30); do
            if gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --required --watch --interval 20; then
              gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge
              exit 0
            fi
            sleep 20
          done
          echo "Required checks did not pass within the release window." >&2
          exit 1
